<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#115E73">
<link rel="manifest" href="revision-ide.manifest.json">
<link rel="icon" href="revision-ide-icon-192.png">
<link rel="apple-touch-icon" href="revision-ide-icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="La Syncope">
<meta name="mobile-web-app-capable" content="yes">
<title>La Syncope</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{ color-scheme:light dark; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  img{ max-width:100%; }

  :root{
    --paper:#F0F4F3;
    --surface:#FFFFFF;
    --surface-2:#F7F9F8;
    --ink:#171A1F;
    --ink-soft:#5B616B;
    --ink-faint:#8A8F97;
    --line:#DCE3E1;
    --line-strong:#C3CDCA;
    --accent:#0F8A6B;
    --accent-ink:#062017;
    --accent-soft:#DCF3EA;
    --deep:#115E73;
    --deep-soft:#DEEEF2;
    --good:#2E7D4F;
    --good-soft:#E1F1E6;
    --warn:#C17A00;
    --warn-soft:#FBEDD6;
    --bad:#B3392A;
    --bad-soft:#F8E4E0;
    --shadow: 0 1px 2px rgba(23,26,31,.06), 0 6px 20px -8px rgba(23,26,31,.14);
    --radius: 14px;
    font-variant-numeric: tabular-nums;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#0F1416;
      --surface:#171D20;
      --surface-2:#1C2327;
      --ink:#ECEEEF;
      --ink-soft:#A4ABB4;
      --ink-faint:#767D86;
      --line:#2A3236;
      --line-strong:#394247;
      --accent:#3FCBA0;
      --accent-ink:#062017;
      --accent-soft:#12352C;
      --deep:#6FC3DA;
      --deep-soft:#122A32;
      --good:#5BBE84;
      --good-soft:#173425;
      --warn:#E2A93B;
      --warn-soft:#3A2C10;
      --bad:#E4786A;
      --bad-soft:#3A1F1C;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -8px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --paper:#0F1416; --surface:#171D20; --surface-2:#1C2327; --ink:#ECEEEF;
    --ink-soft:#A4ABB4; --ink-faint:#767D86; --line:#2A3236; --line-strong:#394247;
    --accent:#3FCBA0; --accent-ink:#062017; --accent-soft:#12352C;
    --deep:#6FC3DA; --deep-soft:#122A32; --good:#5BBE84; --good-soft:#173425;
    --warn:#E2A93B; --warn-soft:#3A2C10; --bad:#E4786A; --bad-soft:#3A1F1C;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -8px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box;}
  [hidden]{ display:none !important; }
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{
    font-family:"Fraunces", Georgia, serif;
    text-wrap:balance;
    margin:0;
    letter-spacing:-0.01em;
  }
  .mono{ font-family:"IBM Plex Mono", ui-monospace, monospace; }
  a{color:inherit;}
  button{font-family:inherit;}

  .app{ max-width:960px; margin:0 auto; padding-inline:16px; padding-block: calc(env(safe-area-inset-top,0px) + 14px) calc(env(safe-area-inset-bottom,0px) + 92px); }

  /* ---------- Header ---------- */
  header.top{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding-block:6px 16px;
  }
  header.top .brand{ display:flex; align-items:center; gap:10px; }
  header.top .brand .logo{
    width:38px; height:38px; border-radius:11px; background:linear-gradient(160deg,var(--deep),var(--accent));
    display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:16px; flex:none;
    box-shadow: var(--shadow);
  }
  header.top h1{ font-size:19px; }
  header.top .sub{ font-size:12px; color:var(--ink-soft); }
  .icon-btn{
    width:38px; height:38px; border-radius:11px; border:1px solid var(--line); background:var(--surface);
    color:var(--ink); display:flex; align-items:center; justify-content:center; cursor:pointer; flex:none;
    font-size:17px;
  }
  .icon-btn:active{ transform: scale(.96); }
  .header-actions{ display:flex; gap:8px; }

  /* ---------- Cards / layout ---------- */
  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow: var(--shadow); padding:16px;
  }
  .card + .card{ margin-top:12px; }
  .stack{ display:flex; flex-direction:column; gap:12px; }
  .row{ display:flex; align-items:center; gap:10px; }
  .row.between{ justify-content:space-between; }
  .row.wrap{ flex-wrap:wrap; }
  .grid3{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  @media (max-width:640px){ .grid3{ grid-template-columns:1fr; } }
  .muted{ color:var(--ink-soft); }
  .faint{ color:var(--ink-faint); font-size:12px; }
  .small{ font-size:13px; }
  .tag{
    display:inline-flex; align-items:center; gap:4px; padding:2px 9px; border-radius:999px;
    font-size:11px; font-weight:600; background:var(--surface-2); color:var(--ink-soft); border:1px solid var(--line);
  }
  .tag.accent{ background:var(--accent-soft); color:var(--accent-ink); border-color:transparent; }
  .tag.deep{ background:var(--deep-soft); color:var(--deep); border-color:transparent; }
  .tag.good{ background:var(--good-soft); color:var(--good); border-color:transparent; }
  .tag.warn{ background:var(--warn-soft); color:var(--warn); border-color:transparent; }
  .tag.bad{ background:var(--bad-soft); color:var(--bad); border-color:transparent; }

  /* ---------- Buttons ---------- */
  .btn{
    appearance:none; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink);
    padding:9px 14px; border-radius:10px; font-size:14px; font-weight:600; cursor:pointer;
    display:inline-flex; align-items:center; gap:6px; justify-content:center;
  }
  .btn:active{ transform:scale(.98); }
  .btn.primary{ background:var(--accent); border-color:transparent; color:var(--accent-ink); }
  .btn.deep{ background:var(--deep); border-color:transparent; color:#fff; }
  .btn.ghost{ background:transparent; border-color:transparent; }
  .btn.danger{ background:var(--bad-soft); color:var(--bad); border-color:transparent; }
  .btn.block{ width:100%; }
  .btn.sm{ padding:6px 10px; font-size:12.5px; border-radius:8px; }
  .btn[disabled]{ opacity:.45; pointer-events:none; }

  /* ---------- Progress ---------- */
  .bar{ height:8px; border-radius:99px; background:var(--surface-2); overflow:hidden; border:1px solid var(--line); }
  .bar > span{ display:block; height:100%; background:linear-gradient(90deg,var(--deep),var(--accent)); border-radius:99px; }
  .ring{ position:relative; width:64px; height:64px; flex:none; }
  .ring svg{ width:100%; height:100%; transform:rotate(-90deg); }
  .ring circle{ fill:none; stroke-width:7; }
  .ring .bg{ stroke:var(--surface-2); }
  .ring .fg{ stroke:var(--accent); stroke-linecap:round; transition:stroke-dashoffset .4s; }
  .ring .pct{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; }

  /* ---------- Nav tabs ---------- */
  .tabs{ display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none; }
  .tabs::-webkit-scrollbar{ display:none; }
  .tabs button{
    appearance:none; border:1px solid var(--line); background:var(--surface); color:var(--ink-soft);
    padding:8px 13px; border-radius:99px; font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap;
  }
  .tabs button.active{ background:var(--deep); border-color:transparent; color:#fff; }

  /* ---------- Bottom nav ---------- */
  nav.bottom{
    position:fixed; left:0; right:0; bottom:0; z-index:40;
    background:var(--surface); border-top:1px solid var(--line);
    padding: 8px max(10px, env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px, env(safe-area-inset-right));
    display:flex; justify-content:space-around;
    box-shadow: 0 -6px 18px -12px rgba(0,0,0,.2);
  }
  nav.bottom button{
    appearance:none; background:none; border:none; color:var(--ink-faint); cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10px; font-weight:600;
    padding:4px 6px; border-radius:10px; min-width:56px; flex:1; max-width:80px;
  }
  nav.bottom button .ic{ font-size:19px; line-height:1; }
  nav.bottom button.active{ color:var(--deep); }
  nav.bottom button.active .ic{ transform:scale(1.05); }

  /* ---------- Module accordion ---------- */
  .module{ border:1px solid var(--line); border-radius:var(--radius); background:var(--surface); overflow:hidden; }
  .module + .module{ margin-top:10px; }
  .module > .mhead{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:13px 14px; cursor:pointer; }
  .module > .mhead h3{ font-size:15.5px; font-family:"IBM Plex Sans"; font-weight:700; }
  .module > .mbody{ border-top:1px solid var(--line); padding:12px 14px 14px; background:var(--surface-2); }
  .chevron{ transition:transform .15s; color:var(--ink-faint); }
  .module.open .chevron{ transform:rotate(90deg); }

  .subtabs{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .subtabs button{
    appearance:none; border:1px solid var(--line); background:var(--surface); color:var(--ink-soft);
    padding:5px 11px; border-radius:8px; font-size:12px; font-weight:700; cursor:pointer;
  }
  .subtabs button.active{ background:var(--accent-soft); color:var(--accent-ink); border-color:transparent; }

  .item{
    background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:11px 12px; margin-bottom:8px;
  }
  .item .ihead{ display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
  .item p{ margin:6px 0 0; white-space:pre-wrap; font-size:13.5px; line-height:1.5; }
  .item .iactions{ display:flex; gap:6px; flex:none; }
  .opt{
    display:flex; align-items:center; gap:8px; padding:7px 9px; border:1px solid var(--line); border-radius:8px; margin-top:6px; font-size:13.5px;
  }
  .opt.correct{ background:var(--good-soft); border-color:transparent; }
  .opt.wrong{ background:var(--bad-soft); border-color:transparent; }

  /* ---------- Forms ---------- */
  label.field{ display:block; margin-bottom:10px; }
  label.field > span{ display:block; font-size:12.5px; font-weight:700; color:var(--ink-soft); margin-bottom:5px; }
  input[type=text], input[type=number], input[type=search], textarea, select{
    width:100%; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink);
    border-radius:9px; padding:9px 11px; font-size:14px; font-family:inherit;
  }
  textarea{ min-height:78px; resize:vertical; }
  .opt-row{ display:flex; align-items:center; gap:8px; margin-bottom:7px; }
  .opt-row input[type=text]{ flex:1; }
  .checkbox-row{ display:flex; align-items:center; gap:8px; }

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(10,14,16,.5); display:flex; align-items:flex-end; justify-content:center;
    z-index:100; backdrop-filter: blur(2px);
  }
  @media (min-width:640px){ .overlay{ align-items:center; } }
  .modal{
    background:var(--surface); width:100%; max-width:560px; max-height:88vh; overflow:auto;
    border-radius:18px 18px 0 0; padding:18px; box-shadow:0 -10px 40px rgba(0,0,0,.25);
  }
  @media (min-width:640px){ .modal{ border-radius:16px; } }
  .modal h2{ font-size:18px; margin-bottom:14px; }
  .modal .foot{ display:flex; gap:8px; justify-content:flex-end; margin-top:16px; }

  .empty{ text-align:center; padding:26px 10px; color:var(--ink-faint); }
  .empty .big{ font-size:32px; margin-bottom:6px; }

  .toast{
    position:fixed; bottom:96px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--paper);
    padding:9px 16px; border-radius:99px; font-size:13px; font-weight:600; z-index:200; box-shadow:var(--shadow);
    opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-4px); }

  .quiz-progress{ font-size:12.5px; color:var(--ink-soft); font-weight:600; }
  .badge-count{
    min-width:20px; height:20px; padding:0 5px; border-radius:99px; background:var(--surface-2); color:var(--ink-soft);
    font-size:11px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; border:1px solid var(--line);
  }

  .search-overlay{ position:fixed; inset:0; background:var(--paper); z-index:90; overflow:auto; }
  .search-overlay .app{ padding-top: calc(env(safe-area-inset-top,0px) + 14px); }

  ::selection{ background:var(--accent-soft); }

  /* ---- Mascotte : le Professeur Serpent (compagnon permanent) ---- */
  #mascot-root{ position:fixed; left:0; right:0; bottom:0; z-index:150; pointer-events:none; }
  .mascot-wrap{
    position:absolute; right:14px; bottom:calc(env(safe-area-inset-bottom,0px) + 88px);
    display:flex; align-items:flex-end; gap:8px; max-width:min(320px, calc(100vw - 28px));
    opacity:0; transform:translateY(10px) scale(.9); transition:opacity .3s ease, transform .3s ease;
    pointer-events:none;
  }
  .mascot-wrap.present{ opacity:1; transform:translateY(0) scale(1); }
  .mascot-avatar{
    width:52px; height:52px; flex:none; cursor:pointer; border:none; background:none; padding:0;
    filter:drop-shadow(0 4px 10px rgba(0,0,0,.18)); transition:transform .2s ease; pointer-events:auto;
  }
  .mascot-avatar:active{ transform:scale(.93); }
  .mascot-avatar svg{ width:100%; height:100%; display:block; }
  .mascot-bubble{
    background:var(--surface); border:1px solid var(--line); border-radius:14px 14px 14px 4px;
    padding:10px 26px 10px 12px; font-size:13px; font-weight:600; color:var(--ink); box-shadow:var(--shadow);
    position:relative; line-height:1.35; max-width:250px;
    opacity:0; transform:translateY(6px) scale(.96); transform-origin:bottom left;
    transition:opacity .2s ease, transform .2s ease; pointer-events:none;
  }
  .mascot-bubble.show{ opacity:1; transform:translateY(0) scale(1); pointer-events:auto; }
  .mascot-bubble .mascot-close{
    position:absolute; top:6px; right:6px; width:18px; height:18px; border-radius:99px; border:none;
    background:transparent; color:var(--ink-faint); font-size:12px; line-height:1; display:flex; align-items:center; justify-content:center;
    cursor:pointer; pointer-events:auto; padding:0;
  }
  .mascot-wrap.mood-happy .mascot-avatar{ animation:mascot-bounce .6s ease; }
  .mascot-wrap.mood-encourage .mascot-avatar{ animation:mascot-wiggle .5s ease; }
  .mascot-wrap.mood-alert .mascot-avatar{ animation:mascot-shake .45s ease 2; }
  .mascot-wrap.mood-alert .mascot-bubble{ border-color:var(--bad); background:var(--bad-soft); }
  .mascot-wrap.mood-happy .mascot-bubble{ border-color:var(--good); background:var(--good-soft); }
  .mascot-wrap.mood-encourage .mascot-bubble{ border-color:var(--warn); background:var(--warn-soft); }
  @keyframes mascot-bounce{ 0%{transform:translateY(0);} 30%{transform:translateY(-9px);} 55%{transform:translateY(0);} 75%{transform:translateY(-4px);} 100%{transform:translateY(0);} }
  @keyframes mascot-wiggle{ 0%,100%{transform:rotate(0);} 25%{transform:rotate(-9deg);} 75%{transform:rotate(9deg);} }
  @keyframes mascot-shake{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 50%{transform:translateX(6px);} 75%{transform:translateX(-4px);} }
  @media (max-width:420px){ .mascot-wrap{ right:8px; } .mascot-avatar{ width:44px; height:44px; } }

  /* ---- Écrans d'inscription / verrouillage ---- */
  .auth-screen{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
    background:linear-gradient(160deg, var(--paper), var(--deep-soft));
  }
  .auth-card{
    width:100%; max-width:380px; background:var(--surface); border:1px solid var(--line); border-radius:20px;
    padding:28px 22px; box-shadow:var(--shadow);
  }
  .auth-brand{ display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:20px; animation:auth-pop .5s ease; }
  .auth-cross{
    width:56px; height:56px; border-radius:16px; background:linear-gradient(160deg,var(--deep),var(--accent));
    color:#fff; display:flex; align-items:center; justify-content:center; font-size:30px; font-weight:700;
    box-shadow:0 6px 16px -6px rgba(0,0,0,.35);
  }
  .auth-brand h1{ font-size:21px; margin:0; }
  @keyframes auth-pop{ 0%{opacity:0; transform:scale(.82) translateY(10px);} 100%{opacity:1; transform:scale(1) translateY(0);} }

  /* ---- Cas cliniques (simulation de consultation) ---- */
  .cas-anamnese{
    background:var(--surface-2); border:1px solid var(--line); border-radius:12px; padding:12px 14px;
    font-size:14px; line-height:1.55; font-style:italic;
  }
  .cas-triade{
    margin-top:10px; background:var(--warn-soft); border:1px solid var(--warn); border-radius:10px;
    padding:10px 12px; font-size:13px; line-height:1.5; color:var(--ink);
  }
  .cas-cat{
    margin-top:10px; background:var(--deep-soft); border:1px solid var(--deep); border-radius:10px;
    padding:10px 12px; font-size:13.5px; line-height:1.55;
  }

  /* ---- Regroupement par UE (classification) dans Programme et Cours ---- */
  .ue-group{ margin-top:18px; }
  .ue-group-head{
    font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint);
    padding:0 2px 7px; margin-bottom:8px; border-bottom:1px solid var(--line);
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="mascot-root"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

/* =========================================================
   CONSTANTES & SEED
   ========================================================= */
var STORAGE_KEY = "revision_ide_state_v1";
var APP_VERSION = 1;

function uid(){ return Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4); }

function makeModule(name, extra){
  var m = { id: uid(), name: name, cours: [], qcm: [], qcd: [], exercices: [], casClinique: [] };
  if (extra) {
    if (extra.ue) m.ue = extra.ue;
    if (extra.ueCode) m.ueCode = extra.ueCode;
    if (extra.credits !== undefined) m.credits = extra.credits;
    if (extra.semestre !== undefined) m.semestre = extra.semestre;
    if (extra.cours) m.cours = extra.cours.map(function(c){ return Object.assign({ id: uid(), reviewLater:false, lastReviewed:null }, c); });
    if (extra.qcm) m.qcm = extra.qcm.map(function(q){ return Object.assign({ id: uid(), reviewLater:false, lastResult:null }, q); });
    if (extra.qcd) m.qcd = extra.qcd.map(function(q){ return Object.assign({ id: uid(), reviewLater:false, lastResult:null }, q); });
    if (extra.exercices) m.exercices = extra.exercices.map(function(e){ return Object.assign({ id: uid(), reviewLater:false, mastered:false }, e); });
    if (extra.casClinique) m.casClinique = extra.casClinique.map(function(c){ return Object.assign({ id: uid(), reviewLater:false, lastResult:null }, c); });
  }
  return m;
}

function buildSeed(){
  return {
    version: APP_VERSION,
    settings: { name: "" },
    onboardingSeen: false,
    registration: null,
    history: [],
    years: [
      {
        id: "a1", label: "1ère année", note: "Sciences fondamentales et bases du soin",
        modules: [
          makeModule("Anatomie et Physiologie", {
            cours: [{ title: "Les grandes fonctions de l'organisme (exemple)",
              body: "Le corps humain assure 4 grandes fonctions vitales :\n\n1. La fonction de nutrition (digestion, respiration, circulation, excrétion)\n2. La fonction de relation (système nerveux, organes des sens, appareil locomoteur)\n3. La fonction de reproduction\n4. La fonction de régulation (système endocrinien, homéostasie)\n\nLe corps est organisé en 4 cavités principales : crânienne, thoracique, abdominale et pelvienne, chacune contenant des organes spécifiques." }],
            qcm: [{ question: "Parmi les éléments suivants, lesquels font partie des éléments figurés du sang ? (exemple)",
              options: ["Globules rouges (hématies)", "Globules blancs (leucocytes)", "Plaquettes (thrombocytes)", "Plasma"],
              correct: [0,1,2], explanation: "Le sang est composé du plasma (partie liquide) et des éléments figurés : globules rouges, globules blancs et plaquettes." }],
            qcd: [{ question: "Le cœur est situé principalement dans quelle cavité ? (exemple)",
              options: ["Cavité abdominale", "Cavité thoracique", "Cavité pelvienne", "Cavité crânienne"],
              correct: [1], explanation: "Le cœur se situe dans le médiastin, au sein de la cavité thoracique, entre les deux poumons." }],
            exercices: [{ statement: "Citez les 4 cavités du corps humain et donnez un exemple d'organe contenu dans chacune. (exemple)",

              { statement: "[SF L2 · Sujet n°1 — CAS CLINIQUE] Madame A.A.A., âgée de 27 ans, femme au foyer, 4ème geste, 3ème pare, est admise le mardi 25 septembre 2018 à 8 heures au CHU de Treichville pour accouchement à la 37ème semaine d'aménorrhée. Cette grossesse a été marquée par des métrorragies au 2ème et au 3ème trimestre ; ces métrorragies étaient indolores et faites de sang rouge vif. L'échographie pratiquée le 20 septembre 2018 a révélé un placenta prævia. L'examen à l'admission note en particulier : TA=120/70 mmHg ; pouls=80/mn ; conjonctives peu colorées ; col utérin dilaté à 3 cm ; taux d'hémoglobine réalisé en urgence à 10 g/100 ml de sang. Elle a accouché à 15 heures d'une fille pesant 4300g, mesurant 52 cm, avec un score d'Apgar de 10 à 1 minute et 10 à 5 minutes. Une épisiotomie a été pratiquée. Le placenta pèse 800 grammes et les membranes sont complètes. Après la délivrance, Mme A.A.A. saigne et la quantité de sang perdu est de 300 ml. L'accouchée est obnubilée, la TA=75/60 mmHg, le pouls=120/mn ; il n'y a pas de lésion traumatique de l'appareil génital en dehors de l'épisiotomie qui ne saigne pas.\n\nQuestion 3 : Quel est votre diagnostic chez cette accouchée ? (A. Suites de couches normales / B. Hémorragie de la délivrance / C. Hémorragie du post-partum immédiat / D. Endométrite du post-partum)\n\nQuestion 4 : Pour éviter que Mme A.A.A. ne meure de cette hémorragie du post-partum immédiat, il faut (2 propositions) : A. Vérifier l'intégrité du col utérin / B. Vérifier l'intégrité du rectum / C. Vérifier l'intégrité du vagin / D. Réaliser une délivrance artificielle suivie de révision utérine / E. Mettre en place une perfusion d'ocytocique et administrer des prostaglandines (Cytotec) / F. Réaliser une révision utérine\n\nQuestion 5 : Si Mme A.A.A. continue de saigner car l'utérus reste hypotonique, vous, Sage-Femme, pouvez avoir recours à (2 propositions) : A. Pratiquer une délivrance artificielle / B. Pratiquer une délivrance artificielle suivie de révision utérine / C. Réaliser un massage utérin externe en continu / D. Réaliser une ligature des artères hypogastriques / E. Mettre en place un ballonnet intra-utérin si j'en dispose / F. Réaliser une ablation de l'utérus\n\nQuestion 6 : On peut dire qu'il s'agit d'une hémorragie du post-partum immédiat parce que (2 réponses) : A. Le taux d'hémoglobine réalisé en urgence est à 10 g/100 ml / B. Le placenta pèse 800 grammes / C. La TA est abaissée (75/60 mmHg) / D. L'hémorragie est inférieure à 500 ml / E. Le pouls est accéléré (120/mn) / F. Il n'y a pas de lésion traumatique\n\nQuestion 7 : La cause de cette hémorragie du post-partum immédiat peut être ici : A. Une hypotonie utérine / B. L'anémie antérieure / C. Une déchirure du col utérin / D. Une déchirure vaginale",

              { statement: "ÉTUDE DE CAS — Village de Bozi (district sanitaire de Bouaflé)\n\nBozi dispose d'un centre de santé où exercent 2 infirmiers et 1 sage-femme diplômés d'État. Le dispensaire et la maternité totalisent 18 lits. Le ratio personnel infirmier / lits du dispensaire est de 0,2.\n\nEn 2019, 140 naissances vivantes ont été enregistrées. La même année, le dispensaire a recensé 100 cas de rougeole chez les enfants de 0-11 mois (taux de létalité 4%) et 150 cas de paludisme chez les 0-5 ans.\n\nEn 2020, la population totale du village était de 2696 habitants, avec un taux de croissance annuel constant de 3%. On estime que les enfants de 0-5 ans représentent 20% de la population, et que le nombre de grossesses attendues représente 5% de la population.\n\nCalculer :\n1. La population de Bozi en fin 2019\n2. Le nombre de lits disponibles au dispensaire du village\n3. Le nombre de décès dû à la rougeole en 2019\n4. Le taux de prévalence du paludisme dans la tranche d'âge 0-5 ans en 2019\n5. Le nombre de grossesses attendues dans le village au cours de l'année 2018",
                correction: "1. Population fin 2019 : Pt = P0(1+r)^t → P0 = Pt / (1+r)^t = 2696 / (1,03)^1 ≈ 2618 habitants\n2. Lits disponibles : Ratio = Infirmiers / Lits → Lits = Infirmiers / Ratio = 2 / 0,2 = 10 lits\n3. Décès dus à la rougeole : Taux de létalité = (Décès / Cas) × 100 → 4% de 100 cas = 4 décès\n4. Taux de prévalence du paludisme 0-5 ans : Population 0-5 ans = 20% × 2618 ≈ 524 enfants ; Taux = 150 / 524 × 100 ≈ 28,63%\n5. Grossesses attendues 2018 : Population 2018 = 2618 / 1,03 ≈ 2542 habitants ; Grossesses attendues = 5% × 2542 ≈ 128 grossesses" },

              { question: "[Banque de révision] L'hémoglobine a plus d'affinité avec le CO2 qu'avec l'O2.", options: ["Vrai","Faux"], correct: [1], explanation: "D'après la banque de révision « Pathologies Respiratoires »." },
              { question: "[Banque de révision] Le poumon gauche assure environ 45% du travail respiratoire.", options: ["Vrai","Faux"], correct: [0], explanation: "D'après la banque de révision « Pathologies Respiratoires » (le poumon gauche, plus petit à 2 lobes, travaille un peu moins que le droit)." },
              { question: "[Banque de révision] La tuberculose multirésistante désigne un cas où le BK résiste à la rifampicine.", options: ["Vrai","Faux"], correct: [0], explanation: "D'après la banque de révision « Pathologies Respiratoires »." },
              { question: "[Banque de révision] Les principaux facteurs de risque de la pneumonie sont l'âge et l'affaiblissement du système immunitaire.", options: ["Vrai","Faux"], correct: [0], explanation: "D'après la banque de révision « Pathologies Respiratoires »." },
              { question: "[Banque de révision] L'asthme est une maladie inflammatoire AIGUË des bronches.", options: ["Vrai","Faux"], correct: [1], explanation: "D'après la banque de révision « Pathologies Respiratoires » (l'asthme est une maladie inflammatoire CHRONIQUE)." },
              { question: "[Banque de révision] L'asthme entraîne une obstruction des voies aériennes par un bronchospasme paroxystique.", options: ["Vrai","Faux"], correct: [0], explanation: "D'après la banque de révision « Pathologies Respiratoires »." },
              { question: "[Banque de révision] Pendant la crise d'asthme, il y a formation d'un œdème et une hypersécrétion de mucus.", options: ["Vrai","Faux"], correct: [0], explanation: "D'après la banque de révision « Pathologies Respiratoires »." },
              { question: "[Banque de révision] L'infection est un facteur fréquent dans le déclenchement de l'asthme.", options: ["Vrai","Faux"], correct: [0], explanation: "D'après la banque de révision « Pathologies Respiratoires »." },
              { question: "[Banque de révision] La crise d'asthme est déclenchée de façon régulière par l'infection et l'hypersensibilité à diverses substances non allergènes.", options: ["Vrai","Faux"], correct: [0], explanation: "D'après la banque de révision « Pathologies Respiratoires »." },
              { question: "[Banque de révision] La dyspnée dans la crise d'asthme évolue classiquement en une phase sèche puis une phase humide.", options: ["Vrai","Faux"], correct: [0], explanation: "D'après la banque de révision « Pathologies Respiratoires »." },
              { question: "[Banque de révision] La polypnée et l'expectoration sont les grands moments qui président à la crise d'asthme.", options: ["Vrai","Faux"], correct: [0], explanation: "D'après la banque de révision « Pathologies Respiratoires »." },
              { question: "[Banque de révision] L'asthme aigu grave (AAG) est appelé état de mal asthmatique chez un patient insuffisant respiratoire.", options: ["Vrai","Faux"], correct: [0], explanation: "D'après la banque de révision « Pathologies Respiratoires »." },
              { question: "[Banque de révision] Les gouttelettes de sécrétions respiratoires émises par un patient atteint de tuberculose OSSEUSE sont vecteurs de transmission de la maladie.", options: ["Vrai","Faux"], correct: [1], explanation: "D'après la banque de révision « Pathologies Respiratoires » (c'est la tuberculose PULMONAIRE qui se transmet ainsi)." },
              { question: "[Banque de révision] Parmi les formes de tuberculose, SEULE la tuberculose pulmonaire est contagieuse.", options: ["Vrai","Faux"], correct: [1], explanation: "D'après la banque de révision « Pathologies Respiratoires »." },
              { question: "[Banque de révision] Le risque de transmission de la tuberculose pulmonaire est plus important si le patient est bacillifère.", options: ["Vrai","Faux"], correct: [0], explanation: "D'après la banque de révision « Pathologies Respiratoires »." },
              { question: "[Banque de révision] La primo-infection est le premier contact avec le bacille, symptomatique ou asymptomatique.", options: ["Vrai","Faux"], correct: [0], explanation: "D'après la banque de révision « Pathologies Respiratoires »." },
              { question: "[Banque de révision] L'infection tuberculeuse latente est une infection sans signe clinique, bactériologique ou radiologique, avec un test tuberculinique POSITIF.", options: ["Vrai","Faux"], correct: [0], explanation: "D'après la banque de révision « Pathologies Respiratoires »." },
              { question: "[Banque de révision] L'infection tuberculeuse latente est une infection avec un test tuberculinique NÉGATIF, sans signe clinique, bactériologique ou radiologique.", options: ["Vrai","Faux"], correct: [1], explanation: "D'après la banque de révision « Pathologies Respiratoires » (le test doit être positif, pas négatif)." },
              { question: "[Banque de révision] Il faut impérativement avoir éliminé une tuberculose maladie pour pouvoir parler d'infection tuberculeuse latente.", options: ["Vrai","Faux"], correct: [0], explanation: "D'après la banque de révision « Pathologies Respiratoires »." },
              { question: "[Banque de révision] Il faut traiter systématiquement l'infection tuberculeuse latente chez les enfants, les adolescents et les immunodéprimés.", options: ["Vrai","Faux"], correct: [0], explanation: "D'après la banque de révision « Pathologies Respiratoires »." },
              { question: "[Banque de révision] Il faut traiter les adultes ayant une IDR > 15 mm dans l'entourage d'un malade bacillifère.", options: ["Vrai","Faux"], correct: [0], explanation: "D'après la banque de révision « Pathologies Respiratoires »." },
              { question: "[Banque de révision] Le BCG-ite est une complication bénigne : suppuration locale transitoire avec parfois adénopathie axillaire.", options: ["Vrai","Faux"], correct: [0], explanation: "D'après la banque de révision « Pathologies Respiratoires »." },
              { question: "[Banque de révision] Le BCG-ite est une suppuration locale transitoire avec parfois adénopathie axillaire (sans autre précision).", options: ["Vrai","Faux"], correct: [1], explanation: "D'après la banque de révision « Pathologies Respiratoires »." },
              { question: "[Banque de révision] L'indice tuberculinique est le nombre d'enfants qui, en 1 an, voient l'IDR devenir positive.", options: ["Vrai","Faux"], correct: [1], explanation: "D'après la banque de révision « Pathologies Respiratoires » (le terme exact est « index tuberculinique », pas « indice »)." },
              { question: "[Banque de révision] On fait le tubage pour recueillir le crachat et les sécrétions bronchiques dégluties au cours du sommeil.", options: ["Vrai","Faux"], correct: [0], explanation: "D'après la banque de révision « Pathologies Respiratoires »." },
              { question: "[Banque de révision] Les perfusions de soluté trop abondantes et trop rapides provoquent un OAP.", options: ["Vrai","Faux"], correct: [0], explanation: "D'après la banque de révision « Pathologies Respiratoires »." },
              { question: "[Banque de révision] L'infection respiratoire est un facteur déclenchant fréquent de l'asthme.", options: ["Vrai","Faux"], correct: [0], explanation: "D'après la banque de révision « Pathologies Respiratoires »." },
              { question: "[Banque de révision] La primo-infection tuberculeuse est le premier contact avec le bacille de Koch, suivi du virage de l'intradermo-réaction (IDR).", options: ["Vrai","Faux"], correct: [1], explanation: "D'après la banque de révision « Pathologies Respiratoires » (il manque la précision que l'IDR devient positive)." },
              { question: "[Banque de révision] L'infirmière doit aider l'insuffisant respiratoire aigu à contrôler ses mouvements respiratoires et à réaliser des expectorations forcées.", options: ["Vrai","Faux"], correct: [0], explanation: "D'après la banque de révision « Pathologies Respiratoires »." },
              { question: "[Banque de révision] L'insuffisance respiratoire est une maladie inflammatoire au long cours des poumons et des bronches.", options: ["Vrai","Faux"], correct: [1], explanation: "D'après la banque de révision « Pathologies Respiratoires » (cette définition correspond plutôt à la BPCO)." },
              { question: "[Banque de révision] Recueillir les urines REMISES et noter la diurèse en cas d'OAP permet d'apprécier les effets des diurétiques.", options: ["Vrai","Faux"], correct: [1], explanation: "D'après la banque de révision « Pathologies Respiratoires » (le terme exact est « urines émises »)." },
              { question: "[Banque de révision] Recueillir les urines ÉMISES et noter la diurèse en cas d'OAP permet d'apprécier les effets des diurétiques.", options: ["Vrai","Faux"], correct: [0], explanation: "D'après la banque de révision « Pathologies Respiratoires »." },
              { question: "[Banque de révision] Les tests tuberculiniques permettent de savoir si un individu a déjà été en contact avec le BK ou non.", options: ["Vrai","Faux"], correct: [0], explanation: "D'après la banque de révision « Pathologies Respiratoires »." },
              { question: "[Banque de révision] La gazométrie est une étude de la teneur en oxygène et des gaz du sang artériel ou capillaire, ainsi que le pH.", options: ["Vrai","Faux"], correct: [0], explanation: "D'après la banque de révision « Pathologies Respiratoires »." },
              { question: "[Banque de révision] L'asthme, l'emphysème, la bronchite chronique et les dilatations des bronches sont les 4 composantes de la BPCO.", options: ["Vrai","Faux"], correct: [0], explanation: "D'après la banque de révision « Pathologies Respiratoires »." },
              { question: "[Banque de révision] La voie aérienne supérieure est formée de la trachée et des bronches.", options: ["Vrai","Faux"], correct: [1], explanation: "D'après la banque de révision « Pathologies Respiratoires » (la voie aérienne SUPÉRIEURE regroupe nez/pharynx/larynx ; trachée et bronches sont les voies aériennes inférieures)." },
              { question: "[Banque de révision] Le volume courant est le volume d'air inspiré et expiré au cours d'un cycle respiratoire normal AVEC EFFORT.", options: ["Vrai","Faux"], correct: [1], explanation: "D'après la banque de révision « Pathologies Respiratoires » (le volume courant se mesure au repos, sans effort, environ 0,5 L)." }

   ========================================================= */
var state = null;

function loadState(){
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) { state = JSON.parse(raw); mergeSeedIntoState(); migrateUeToEcue(); return; }
  } catch(e){ /* ignore corrupted storage */ }
  state = buildSeed();
  saveState();
}
/* Ajoute au state existant les matières/cours/QCM/QCD/exercices du contenu
   d'exemple qui n'y sont pas encore (comparaison par texte, insensible aux
   accents/majuscules), sans jamais toucher à la progression déjà enregistrée.
   Permet aux mises à jour de l'appli (nouvelles matières, nouveaux sujets)
   d'atteindre les appareils qui ont déjà une sauvegarde locale. */
function seedItemKey(kind, it){
  if (kind === "cours") return normalizeForMatch(it.title||"");
  if (kind === "exercices") return normalizeForMatch(it.statement||"");
  if (kind === "casClinique") return normalizeForMatch(it.titre||"");
  return normalizeForMatch(it.question||"");
}
function mergeSeedIntoState(){
  if (!state || !state.years) return;
  var seed = buildSeed();
  var changed = false;
  seed.years.forEach(function(seedYear){
    var y = findYear(seedYear.id);
    if (!y){ state.years.push(seedYear); changed = true; return; }
    seedYear.modules.forEach(function(seedMod){
      var mod = y.modules.find(function(m){ return normalizeForMatch(m.name) === normalizeForMatch(seedMod.name); });
      if (!mod){ y.modules.push(seedMod); changed = true; return; }
      if (!mod.casClinique){ mod.casClinique = []; changed = true; }
      ["cours","qcm","qcd","exercices","casClinique"].forEach(function(kind){
        var existingKeys = {};
        mod[kind].forEach(function(it){ existingKeys[seedItemKey(kind, it)] = true; });
        seedMod[kind].forEach(function(seedItem){
          var key = seedItemKey(kind, seedItem);
          if (!key || existingKeys[key]) return;
          mod[kind].push(seedItem);
          existingKeys[key] = true;
          changed = true;
        });
      });
    });
  });
  if (changed) saveState();
}
/* Nettoie les anciennes matières de niveau UE (remplacées par leurs ECUE
   individuelles) sur les appareils qui avaient déjà reçu l'ancienne
   structure. Une ancienne matière n'est retirée que si elle ne contient
   aucun contenu ajouté par l'utilisateur (sinon elle reste, par sécurité). */

    "Outils de Communication"
  ]
};
function migrateUeToEcue(){
  if (!state || !state.years) return;
  var changed = false;
  Object.keys(OLD_UE_MODULE_NAMES).forEach(function(yearId){
    var y = findYear(yearId);
    if (!y) return;
    OLD_UE_MODULE_NAMES[yearId].forEach(function(oldName){
      var idx = y.modules.findIndex(function(m){ return m.name === oldName; });
      if (idx === -1) return;
      var old = y.modules[idx];
      if (oldName === "Soins Infirmiers dans les Pathologies Chirurgicales" && old.casClinique && old.casClinique.length){
        var target = y.modules.find(function(m){ return m.name === "Chirurgie digestive"; });
        if (target){
          var existingTitles = target.casClinique.map(function(c){ return c.titre; });
          old.casClinique.forEach(function(c){
            if (existingTitles.indexOf(c.titre) === -1) target.casClinique.push(c);
          });
          old.casClinique = [];
        }
      }
      var hasRealContent = old.qcm.length || old.qcd.length || old.exercices.length || (old.casClinique&&old.casClinique.length) ||
        old.cours.some(function(c){ return c.title !== "Programme officiel"; });
      if (!hasRealContent){
        y.modules.splice(idx, 1);
        changed = true;
      }
    });
  });
  if (changed) saveState();
}
function saveState(){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ showToast("Stockage plein ou indisponible : sauvegarde impossible."); }
}
function findYear(yearId){ return state.years.find(function(y){ return y.id === yearId; }); }
function findModule(yearId, moduleId){
  var y = findYear(yearId); if (!y) return null;
  return y.modules.find(function(m){ return m.id === moduleId; });
}
function allowedYearIds(){
  var niveau = state.registration && state.registration.niveau;
  if (niveau === "L1") return ["a1"];
  if (niveau === "L2") return ["a1","a2"];
  if (niveau === "L3") return ["a1","a2","a3"];
  return state.years.map(function(y){ return y.id; });
}
function visibleYears(){
  var allowed = allowedYearIds();
  return state.years.filter(function(y){ return allowed.indexOf(y.id) !== -1; });
}
function allModulesFlat(){
  var out = [];
  visibleYears().forEach(function(y){ y.modules.forEach(function(m){ out.push({ year:y, module:m }); }); });
  return out;
}

/* =========================================================
   UTILITAIRES
   ========================================================= */
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];
  });
}
function escAttr(s){ return esc(s).replace(/\n/g," "); }
function nl2br(s){ return esc(s); } /* white-space:pre-wrap handles line breaks */
function shuffle(arr){
  var a = arr.slice();
  for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function pct(n,d){ if (!d) return 0; return Math.round((n/d)*100); }
var toastTimer = null;
function showToast(msg){
  var el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove("show"); }, 2200);
}
function fmtDate(ts){
  var d = new Date(ts);
  return d.toLocaleDateString('fr-FR', { day:'2-digit', month:'short' });
}

function showMascot(mood, text, opts){
  opts = opts || {};

  text = text || mascotPick(mood);
  if (!mascotShown){
    root.innerHTML =

        '</div>' +
      '</div>';
    mascotShown = true;
    requestAnimationFrame(function(){
      var w = document.getElementById("mascot-wrap");
      if (w) w.classList.add("present");
    });
  }
  var wrap = document.getElementById("mascot-wrap");
  var avatar = document.getElementById("mascot-avatar");
  var bubble = document.getElementById("mascot-bubble");
  var bubbleText = document.getElementById("mascot-bubble-text");

  requestAnimationFrame(function(){ bubble.classList.add("show"); });
  clearTimeout(mascotHideTimer);
  var duration = opts.duration || (mood === "alert" ? 6500 : 4200);
  if (duration) mascotHideTimer = setTimeout(hideMascotBubble, duration);
}

var route = { view: "accueil", params: {} };
function parseHash(){
  var h = location.hash.replace(/^#\/?/, "");
  var parts = h.split("/").filter(Boolean);
  if (!parts.length) return { view:"accueil", params:{} };
  var view = parts[0];
  var params = {};
  if (view === "programme") { params.year = parts[1] || "a1"; }
  if (view === "quiz-run") { /* uses in-memory quiz session */ }
  return { view: view, params: params };
}

window.addEventListener("hashchange", function(){
  var quizWasActive = route.view === "quiz-run" && quizSession && quizSession.index < quizSession.items.length;
  route = parseHash();

   SESSION DE QUIZ (en mémoire, non persistée)
   ========================================================= */
var quizSession = null; /* { items:[{...question, kind, yearId, moduleId}], index, answers:[], scopeLabel } */
var exoSession = null;  /* { items:[...], index, scopeLabel } */

function collectQuestions(kind, yearFilter, moduleFilter, onlyReview){
  var out = [];
  visibleYears().forEach(function(y){
    if (yearFilter && yearFilter !== "all" && y.id !== yearFilter) return;
    y.modules.forEach(function(m){
      if (moduleFilter && moduleFilter.length && moduleFilter.indexOf(m.id) === -1) return;
      var list = kind === "mix"
        ? m.qcm.map(function(q){return Object.assign({},q,{__kind:"qcm"});}).concat(m.qcd.map(function(q){return Object.assign({},q,{__kind:"qcd"});}))
        : (kind === "qcm" ? m.qcm : m.qcd).map(function(q){return Object.assign({},q,{__kind:kind});});
      list.forEach(function(q){
          if (onlyReview && !q.reviewLater) return;
          out.push(Object.assign({}, q, { yearId:y.id, yearLabel:y.label, moduleId:m.id, moduleName:m.name }));
        });
    });
  });
  return out;
}

function computeYearStats(y){
  var totalCours=0, luCours=0, totalQ=0, correctQ=0, answeredQ=0, totalExo=0, masteredExo=0;
  y.modules.forEach(function(m){
    totalCours += m.cours.length;
    luCours += m.cours.filter(function(c){ return c.lastReviewed; }).length;
    m.qcm.concat(m.qcd).forEach(function(q){ totalQ++; if (q.lastResult !== null && q.lastResult !== undefined){ answeredQ++; if (q.lastResult) correctQ++; } });
    totalExo += m.exercices.length;
    masteredExo += m.exercices.filter(function(e){ return e.mastered; }).length;
  });
  return { totalCours:totalCours, luCours:luCours, totalQ:totalQ, correctQ:correctQ, answeredQ:answeredQ, totalExo:totalExo, masteredExo:masteredExo };
}
function overallProgress(){
  var tc=0,lc=0,tq=0,cq=0,aq=0,te=0,me=0;
  visibleYears().forEach(function(y){ var s = computeYearStats(y); tc+=s.totalCours; lc+=s.luCours; tq+=s.totalQ; cq+=s.correctQ; aq+=s.answeredQ; te+=s.totalExo; me+=s.masteredExo; });
  var parts = [];
  if (tc) parts.push(pct(lc,tc));
  if (aq) parts.push(pct(cq,aq));
  if (te) parts.push(pct(me,te));
  var avg = parts.length ? Math.round(parts.reduce(function(a,b){return a+b;},0)/parts.length) : 0;
  return { avg:avg, tc:tc, lc:lc, tq:tq, aq:aq, cq:cq, te:te, me:me };
}
function ringSvg(percent, size){
  size = size || 64;
  var r = (size-14)/2, c = 2*Math.PI*r, off = c - (percent/100)*c;
  return '<div class="ring" style="width:'+size+'px;height:'+size+'px;">' +
    '<svg viewBox="0 0 '+size+' '+size+'"><circle class="bg" cx="'+size/2+'" cy="'+size/2+'" r="'+r+'"/>' +
    '<circle class="fg" cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'"/></svg>' +
    '<div class="pct">'+percent+'%</div></div>';
}
function reviewQueue(){
  var out = [];
  allModulesFlat().forEach(function(x){
    x.module.cours.forEach(function(c){ if (c.reviewLater) out.push({ type:"cours", label:c.title, year:x.year, module:x.module, item:c }); });
    x.module.qcm.forEach(function(q){ if (q.reviewLater) out.push({ type:"qcm", label:q.question, year:x.year, module:x.module, item:q }); });
    x.module.qcd.forEach(function(q){ if (q.reviewLater) out.push({ type:"qcd", label:q.question, year:x.year, module:x.module, item:q }); });
    x.module.exercices.forEach(function(e){ if (e.reviewLater) out.push({ type:"exercice", label:e.statement, year:x.year, module:x.module, item:e }); });
  });
  return out;
}

var docsCache = {}; /* moduleId -> array of document records (loaded lazily from IndexedDB) */

function groupModulesByUE(modules){
  var ungrouped = [];
  var groups = [];
  var groupIndex = {};
  modules.forEach(function(m){
    if (!m.ue){ ungrouped.push(m); return; }
    if (groupIndex[m.ue] === undefined){
      groupIndex[m.ue] = groups.length;
      groups.push({ ue: m.ue, ueCode: m.ueCode || "", modules: [] });
    }
    groups[groupIndex[m.ue]].modules.push(m);
  });
  return { ungrouped: ungrouped, groups: groups };
}
function renderUeGroupHeader(g){
  return '<div class="ue-group-head">' + esc(g.ue) + (g.ueCode ? ' <span class="faint">(' + esc(g.ueCode) + ')</span>' : '') + '</div>';

  var vy = visibleYears();
  var y = findYear(yearId);
  if (!y || vy.indexOf(y) === -1) y = vy[0] || state.years[0];

  }).join("") + '</div>';

  html += '<div class="faint" style="margin-bottom:10px;">' + esc(y.note||"") + '</div>';

  var grouped = groupModulesByUE(y.modules);
  grouped.ungrouped.forEach(function(m){ html += renderModule(y, m); });
  grouped.groups.forEach(function(g){
    html += '<div class="ue-group">' + renderUeGroupHeader(g);

function fmtSize(bytes){
  if (bytes < 1024) return bytes + " o";
  if (bytes < 1024*1024) return Math.round(bytes/1024) + " Ko";
  return (bytes/(1024*1024)).toFixed(1) + " Mo";
}

  var mods = allModulesFlat();
  var available = collectQuestions(quizSetup.kind, quizSetup.year, quizSetup.modules.length?quizSetup.modules:null, quizSetup.onlyReview);
  var html = "";
  html += '<div class="card stack">';
  html += '<div><h3 style="font-size:15px;">Type de questions</h3><div class="tabs" style="margin-top:8px;">' +
    [["mix","Mélange"],["qcm","QCM"],["qcd","QCD"]].map(function(o){
      return '<button class="' + (quizSetup.kind===o[0]?'active':'') + '" data-action="quiz-set-kind" data-kind="' + o[0] + '">' + o[1] + '</button>';
    }).join("") + '</div></div>';

  html += '<div><h3 style="font-size:15px;">Année</h3><div class="tabs" style="margin-top:8px;">' +
    [["all","Toutes"]].concat(visibleYears().map(function(y){return [y.id,y.label];})).map(function(o){
      return '<button class="' + (quizSetup.year===o[0]?'active':'') + '" data-action="quiz-set-year" data-year="' + o[0] + '">' + o[1] + '</button>';

      return '<label class="checkbox-row small"><input type="checkbox" data-action="quiz-toggle-module" data-module="' + x.module.id + '" ' + (checked?'checked':'') + '> ' + esc(x.module.name) + ' <span class="faint">(' + x.year.label + ')</span></label>';

  html += '<label class="field"><span>Nombre de questions (' + available.length + ' disponibles)</span>' +

function renderQuizRun(){
  if (!quizSession) return '<div class="empty">Aucun quiz en cours. <br><button class="btn primary" style="margin-top:10px;" data-action="go" data-hash="#/quiz">Configurer un quiz</button></div>';
  if (quizSession.index >= quizSession.items.length) return renderQuizResult();

  var q = quizSession.items[quizSession.index];
  var ans = quizSession.currentSelection || [];
  var showFeedback = quizSession.showFeedback;
  var html = "";
  html += '<div class="row between quiz-progress" style="margin-bottom:10px;"><span>Question ' + (quizSession.index+1) + ' / ' + quizSession.items.length + '</span><span class="tag deep">' + esc(q.moduleName) + '</span></div>';
  html += '<div class="bar" style="margin-bottom:14px;"><span style="width:' + pct(quizSession.index, quizSession.items.length) + '%"></span></div>';

  html += '<div class="card">';
  html += '<div class="tag ' + (q.__kind==="qcm"?'accent':'deep') + '" style="margin-bottom:8px;">' + q.__kind.toUpperCase() + (q.__kind==="qcm" ? " · réponse(s) multiple(s)" : " · une seule réponse") + '</div>';
  html += '<h3 style="font-size:16px; margin-bottom:12px;">' + esc(q.question) + '</h3>';

  q.options.forEach(function(opt, i){
    var selected = ans.indexOf(i) !== -1;
    var cls = "opt";
    if (showFeedback){
      var isCorrect = q.correct.indexOf(i) !== -1;
      if (isCorrect) cls += " correct";
      else if (selected && !isCorrect) cls += " wrong";
    }
    html += '<div class="' + cls + '" style="cursor:' + (showFeedback?'default':'pointer') + ';" data-action="' + (showFeedback?'noop':'quiz-select') + '" data-index="' + i + '">' +
      '<input type="' + (q.__kind==="qcm"?'checkbox':'radio') + '" ' + (selected?'checked':'') + ' ' + (showFeedback?'disabled':'') + ' style="pointer-events:none;"> ' +
      esc(opt) +
    '</div>';
  });

  if (showFeedback){
    if (q.explanation){
      html += '<div class="faint" style="margin-top:10px; padding-top:10px; border-top:1px solid var(--line);">💡 ' + nl2br(q.explanation) + '</div>';
    } else {
      loadCourseExcerpt(q.moduleId, q.id, q.question);
      var exc = courseExcerptCache[q.moduleId + "::" + q.id];
      if (exc === undefined || exc === null){
        html += '<div class="faint" style="margin-top:10px; padding-top:10px; border-top:1px solid var(--line);">🔎 Recherche d\'un passage dans ton cours…</div>';
      } else if (exc === false){
        html += '<div class="faint" style="margin-top:10px; padding-top:10px; border-top:1px solid var(--line);">Pas d\'explication enregistrée, et aucun passage trouvé dans les cours chargés pour cette matière. Ajoute le cours correspondant dans l\'onglet 📎 Documents de cette matière, ou envoie-moi ce sujet en conversation pour que je vérifie et complète l\'explication.</div>';
      } else {
        html += '<div class="faint" style="margin-top:10px; padding-top:10px; border-top:1px solid var(--line);"><strong>📘 D\'après ton cours (' + esc(exc.fileName) + ')</strong><br>' + esc(exc.snippet) + '</div>';
      }
    }
  }

  html += '<div class="foot" style="margin-top:14px; justify-content:space-between;">' +
    '<button class="btn sm" data-action="quiz-toggle-flag">' + (quizSession.currentFlag ? '🔁 Marqué à revoir' : '🔁 Marquer à revoir') + '</button>';
  if (!showFeedback) html += '<button class="btn primary" data-action="quiz-validate" ' + (!ans.length?'disabled':'') + '>Valider</button>';
  else html += '<button class="btn primary" data-action="quiz-next">' + (quizSession.index+1 < quizSession.items.length ? 'Question suivante →' : 'Voir le résultat →') + '</button>';
  html += '</div></div>';
  return html;
}

function renderQuizResult(){
  var total = quizSession.items.length;
  var correct = quizSession.answers.filter(function(a){ return a.correct; }).length;
  var missed = quizSession.answers.filter(function(a){ return !a.correct; });
  var p = pct(correct, total);
  var html = "";
  html += '<div class="card" style="text-align:center;">' +
    ringSvg(p, 92) +
    '<h2 style="margin-top:12px;">' + correct + ' / ' + total + '</h2>' +
    '<div class="muted small" style="margin-top:4px;">' + (p>=80?"Excellent travail 👏":p>=50?"Pas mal, continue à réviser 💪":"Il faut revoir cette matière 📖") + '</div>' +
  '</div>';

  if (missed.length){
    html += '<div class="card"><h3 style="font-size:15px; margin-bottom:8px;">Questions à revoir (' + missed.length + ')</h3>' +
      missed.map(function(a){ return '<div class="small" style="padding:7px 0; border-bottom:1px solid var(--line);">❌ ' + esc(a.question) + ' <span class="faint">— ' + esc(a.moduleName) + '</span></div>'; }).join("") +
    '</div>';
  }

  html += '<div class="row wrap" style="margin-top:4px;">';
  if (missed.length) html += '<button class="btn deep" style="flex:1;" data-action="quiz-retry-missed">🔁 Refaire les erreurs</button>';
  html += '<button class="btn primary" style="flex:1;" data-action="go" data-hash="#/quiz">Nouveau quiz</button>';
  html += '</div>';
  return html;
}

/* =========================================================
   VUE : CAS CLINIQUES (simulation de consultation)
   ========================================================= */
var casSetup = { year:"all", onlyReview:false };
var casSession = null;

function collectCasCliniques(yearFilter, moduleFilter, onlyReview){
  var out = [];
  visibleYears().forEach(function(y){
    if (yearFilter && yearFilter !== "all" && y.id !== yearFilter) return;
    y.modules.forEach(function(m){
      if (moduleFilter && moduleFilter.length && moduleFilter.indexOf(m.id) === -1) return;
      (m.casClinique||[]).forEach(function(c){
        if (onlyReview && !c.reviewLater) return;
        out.push(Object.assign({}, c, { yearId:y.id, yearLabel:y.label, moduleId:m.id, moduleName:m.name }));
      });
    });
  });
  return out;
}
function renderCasSetup(){
  var available = collectCasCliniques(casSetup.year, null, casSetup.onlyReview);

  var html = '<div class="card stack">';
  html += '<p class="small muted">Une patiente ou un patient se présente à toi : lis l\'anamnèse, repère les symptômes (et la triade caractéristique quand il y en a une), puis pose ton diagnostic parmi 5 propositions avant de découvrir la conduite à tenir (CAT).</p>';
  html += '<div><h3 style="font-size:15px;">Année</h3><div class="tabs" style="margin-top:8px;">' +
    [["all","Toutes"]].concat(visibleYears().map(function(y){return [y.id,y.label];})).map(function(o){
      return '<button class="' + (casSetup.year===o[0]?'active':'') + '" data-action="cas-set-year" data-year="' + o[0] + '">' + o[1] + '</button>';
    }).join("") + '</div></div>';

  html += '<label class="checkbox-row"><input type="checkbox" data-action="cas-toggle-review" ' + (casSetup.onlyReview?'checked':'') + '> <span class="small">Uniquement les cas marqués « à revoir »</span></label>';

  html += '<button class="btn primary block" data-action="cas-start" ' + (!available.length?'disabled':'') + '>🚀 Commencer (' + available.length + ' cas clinique(s))</button>';
  if (!available.length) html += '<div class="faint">Aucun cas clinique ne correspond à ces critères. Ajoute-en depuis l\'onglet 🩻 d\'une matière, dans Programme.</div>';
  html += '</div>';
  return html;
}
function startCas(){
  var pool = collectCasCliniques(casSetup.year, null, casSetup.onlyReview);
  if (!pool.length) return;
  casSession = { items: shuffle(pool), index:0, answers:[], currentSelection:null, showFeedback:false, currentFlag:false };
  navigate("#/cas-run");
}
function renderCasRun(){
  if (!casSession) return '<div class="empty">Aucune session de cas clinique. <br><button class="btn primary" style="margin-top:10px;" data-action="go" data-hash="#/cas">Configurer</button></div>';
  if (casSession.index >= casSession.items.length) return renderCasResult();

  var c = casSession.items[casSession.index];
  var sel = casSession.currentSelection;
  var showFeedback = casSession.showFeedback;
  var html = "";
  html += '<div class="row between quiz-progress" style="margin-bottom:10px;"><span>Cas ' + (casSession.index+1) + ' / ' + casSession.items.length + '</span></div>';
  html += '<div class="bar" style="margin-bottom:14px;"><span style="width:' + pct(casSession.index, casSession.items.length) + '%"></span></div>';

  html += '<div class="card">';
  html += '<div class="tag accent" style="margin-bottom:8px;">🩻 Consultation</div>';
  html += '<h3 style="font-size:16px; margin-bottom:10px;">' + esc(c.titre) + '</h3>';
  html += '<div class="cas-anamnese">' + nl2br(c.anamnese) + '</div>';

  html += '<div class="small" style="font-weight:700; margin:14px 0 8px;">Quel diagnostic retenez-vous ?</div>';
  c.options.forEach(function(opt, i){
    var selected = sel === i;
    var cls = "opt";
    if (showFeedback){
      if (i === c.correct) cls += " correct";
      else if (selected) cls += " wrong";
    }
    html += '<div class="' + cls + '" style="cursor:' + (showFeedback?'default':'pointer') + ';" data-action="' + (showFeedback?'noop':'cas-select') + '" data-index="' + i + '">' +
      '<input type="radio" ' + (selected?'checked':'') + ' ' + (showFeedback?'disabled':'') + ' style="pointer-events:none;"> ' + esc(opt) +
    '</div>';
  });

  if (showFeedback){
    html += '<div class="faint" style="margin-top:12px; padding-top:12px; border-top:1px solid var(--line);">' +
      '<strong>Diagnostic retenu : ' + esc(c.diagnostic || c.options[c.correct]) + '</strong>' +
      (c.explication ? '<br><br>' + nl2br(c.explication) : '') +
      (c.triade ? '<div class="cas-triade">⚠️ ' + nl2br(c.triade) + '</div>' : '') +
    '</div>';
    if (c.cat) html += '<div class="cas-cat"><strong>🩺 CAT — Conduite à tenir</strong><br>' + nl2br(c.cat) + '</div>';
  }

  html += '<div class="foot" style="margin-top:14px; justify-content:space-between;">' +
    '<button class="btn sm" data-action="cas-toggle-flag">' + (casSession.currentFlag ? '🔁 Marqué à revoir' : '🔁 Marquer à revoir') + '</button>';
  if (!showFeedback) html += '<button class="btn primary" data-action="cas-validate" ' + (sel===null?'disabled':'') + '>Valider</button>';
  else html += '<button class="btn primary" data-action="cas-next">' + (casSession.index+1 < casSession.items.length ? 'Cas suivant →' : 'Voir le résultat →') + '</button>';
  html += '</div></div>';
  return html;
}
function renderCasResult(){
  var total = casSession.items.length;
  var correct = casSession.answers.filter(function(a){ return a.correct; }).length;
  var missed = casSession.answers.filter(function(a){ return !a.correct; });
  var p = pct(correct, total);
  var html = "";
  html += '<div class="card" style="text-align:center;">' +
    ringSvg(p, 92) +
    '<h2 style="margin-top:12px;">' + correct + ' / ' + total + '</h2>' +
    '<div class="muted small" style="margin-top:4px;">' + (p>=80?"Excellent raisonnement clinique 👏":p>=50?"Pas mal, continue à t'entraîner 💪":"Revois bien les triades et diagnostics différentiels 📖") + '</div>' +
  '</div>';
  if (missed.length){
    html += '<div class="card"><h3 style="font-size:15px; margin-bottom:8px;">Cas à revoir (' + missed.length + ')</h3>' +
      missed.map(function(a){ return '<div class="small" style="padding:7px 0; border-bottom:1px solid var(--line);">❌ ' + esc(a.titre) + '</div>'; }).join("") +
    '</div>';
  }
  html += '<div class="row wrap" style="margin-top:4px;">';
  if (missed.length) html += '<button class="btn deep" style="flex:1;" data-action="cas-retry-missed">🔁 Refaire les cas ratés</button>';
  html += '<button class="btn primary" style="flex:1;" data-action="go" data-hash="#/cas">Nouveaux cas</button>';
  html += '</div>';
  return html;
}
function casSelectOption(i){
  if (casSession.showFeedback) return;
  casSession.currentSelection = i;
  render();
}
function casValidate(){
  var c = casSession.items[casSession.index];
  var isCorrect = casSession.currentSelection === c.correct;
  casSession.showFeedback = true;
  casSession.answers.push({ titre:c.titre, moduleName:c.moduleName, correct:isCorrect });

  var m = findModule(c.yearId, c.moduleId);
  var orig = (m.casClinique||[]).find(function(x){ return x.id===c.id; });
  if (orig){
    orig.lastResult = isCorrect;
    if (casSession.currentFlag) orig.reviewLater = true;
    else if (isCorrect) orig.reviewLater = false;
    if (!isCorrect) orig.reviewLater = true;
  }
  saveState();
  render();
  showMascot(isCorrect ? "happy" : "encourage");
}
function casNext(){
  casSession.index++;
  casSession.currentSelection = null;
  casSession.showFeedback = false;
  casSession.currentFlag = false;
  render();
}
function casRetryMissed(){
  var missedItems = casSession.items.filter(function(item,i){ return casSession.answers[i] && !casSession.answers[i].correct; });
  casSession = { items: missedItems, index:0, answers:[], currentSelection:null, showFeedback:false, currentFlag:false };
  render();
}

/* =========================================================
   VUE : DIPLOME D'ETAT (revision combinee des 3 annees)
   ========================================================= */
function weakModules(){
  var out = [];
  allModulesFlat().forEach(function(x){
    var qs = x.module.qcm.concat(x.module.qcd);
    var answered = qs.filter(function(q){ return q.lastResult === true || q.lastResult === false; });
    if (answered.length < 2) return;
    var correct = answered.filter(function(q){ return q.lastResult; }).length;
    var p = pct(correct, answered.length);
    if (p < 60) out.push({ moduleName: x.module.name, yearLabel: x.year.label, pct: p, answered: answered.length });
  });
  out.sort(function(a,b){ return a.pct - b.pct; });
  return out.slice(0,8);
}

  var op = overallProgress();
  var weak = weakModules();
  var diplomeHistory = (state.history||[]).filter(function(h){ return h.examType === "diplome"; }).slice(0,10);
  var pool = collectQuestions("mix","all",null,false);
  var html = "";

    '<div style="flex:1;"><div class="small" style="font-weight:700;">Préparation Diplôme d\'État</div>' +
    '<div class="faint" style="margin-top:2px;">Progression combinée sur tes années accessibles (niveau ' + esc((state.registration&&state.registration.niveau)||"") + ') : cours lus, QCM/QCD réussis, exercices maîtrisés.</div></div>' +
  '</div>';

  html += '<div class="card"><h3 style="font-size:15px; margin-bottom:8px;">Par année</h3>';
  visibleYears().forEach(function(y){
    var s = computeYearStats(y);
    var qPct = s.answeredQ ? pct(s.correctQ, s.answeredQ) + '% aux quiz' : 'pas encore de quiz';
    html += '<div class="row between small" style="padding:7px 0; border-bottom:1px solid var(--line);">' +
      '<span>' + esc(y.label) + '</span><span class="faint">' + pct(s.luCours,s.totalCours) + '% des cours lus · ' + qPct + '</span></div>';
  });
  html += '</div>';

  if (weak.length){
    html += '<div class="card"><h3 style="font-size:15px; margin-bottom:8px;">⚠️ Matières à renforcer en priorité</h3>' +
      weak.map(function(w){
        return '<div class="row between small" style="padding:7px 0; border-bottom:1px solid var(--line);">' +
          '<span>' + esc(w.moduleName) + ' <span class="faint">(' + esc(w.yearLabel) + ')</span></span>' +
          '<span class="tag ' + (w.pct<40?'bad':'warn') + '">' + w.pct + '%</span></div>';
      }).join("") + '</div>';
  }

  html += '<div class="card" style="text-align:center;">' +

var TELEGRAM_INBOX_YEAR = "__telegram_inbox__";
var TELEGRAM_INBOX_MODULE = "__telegram_inbox__";
var TELEGRAM_MANIFEST_PATH = "telegram-imports/index.json";
function syncTelegramImports(silent){
  if (!state.telegramSeen) state.telegramSeen = [];
  return fetch(TELEGRAM_MANIFEST_PATH + "?t=" + Date.now()).then(function(r){
    if (!r.ok) throw new Error("manifeste indisponible (" + r.status + ")");
    return r.json();
  }).then(function(list){
    var todo = (list || []).filter(function(e){ return state.telegramSeen.indexOf(e.id) === -1; });
    if (!todo.length){
      if (!silent) showToast("Aucun nouveau document depuis Telegram.");
      return;
    }
    if (!silent) showToast("Synchronisation Telegram : " + todo.length + " document(s)…");
    var imported = 0, rejected = 0;
    var chain = Promise.resolve();
    todo.forEach(function(entry){
      chain = chain.then(function(){
        return fetch(entry.path).then(function(r2){
          if (!r2.ok) throw new Error("fichier indisponible");
          return r2.blob();
        }).then(function(blob){
          var file = new File([blob], entry.fileName, { type: entry.mimeType || "" });
          var kind = detectDocKind(file.name);
          state.telegramSeen.push(entry.id);
          if (kind === "other") return;
          return file.arrayBuffer().then(function(buf){
            return extractTextForDoc(kind, buf).catch(function(){ return ""; }).then(function(text){
              var rejectReason = text ? contentRejectionReason(text) : null;
              if (rejectReason){ rejected++; return; }
              imported++;
              return dbPut({
                id: uid(), yearId: TELEGRAM_INBOX_YEAR, moduleId: TELEGRAM_INBOX_MODULE, moduleName: "Import Telegram",
                fileName: file.name, mimeType: file.type || "", size: file.size, kind: kind,
                text: text, uploadedAt: Date.now(), blob: file
              });
            });
          });
        }).catch(function(){ /* fichier illisible : marqué comme vu pour ne pas boucler dessus */ });
      });
    });
    return chain.then(function(){
      saveState();
      docsCache[TELEGRAM_INBOX_MODULE] = undefined;
      if (route.view === "telegram") loadModuleDocs(TELEGRAM_INBOX_MODULE);
      if (!silent) showToast(imported + " document(s) importé(s)" + (rejected ? (", " + rejected + " refusé(s) car hors-sujet") : "") + ".");
      render();
    });
  }).catch(function(err){
    if (!silent) showToast("Synchronisation Telegram impossible : " + err.message);
  });
}

function runSearch(q){
  var results = document.getElementById("search-results");
  q = (q||"").trim().toLowerCase();
  if (q.length < 2){ results.innerHTML = '<div class="empty small">Tape au moins 2 caractères…</div>'; return; }
  var hits = [];
  allModulesFlat().forEach(function(x){
    x.module.cours.forEach(function(c){ if ((c.title+" "+c.body).toLowerCase().indexOf(q)!==-1) hits.push({ type:"📘 Cours", label:c.title, y:x.year, m:x.module }); });
    x.module.qcm.forEach(function(c){ if (c.question.toLowerCase().indexOf(q)!==-1) hits.push({ type:"☑️ QCM", label:c.question, y:x.year, m:x.module }); });
    x.module.qcd.forEach(function(c){ if (c.question.toLowerCase().indexOf(q)!==-1) hits.push({ type:"🔘 QCD", label:c.question, y:x.year, m:x.module }); });
    x.module.exercices.forEach(function(c){ if (c.statement.toLowerCase().indexOf(q)!==-1) hits.push({ type:"✏️ Exercice", label:c.statement, y:x.year, m:x.module }); });
    if (x.module.name.toLowerCase().indexOf(q)!==-1) hits.push({ type:"📂 Matière", label:x.module.name, y:x.year, m:x.module });
  });
  if (!hits.length){ results.innerHTML = '<div class="empty small">Aucun résultat.</div>'; return; }
  results.innerHTML = hits.map(function(h){
    return '<div class="item" data-action="search-goto" data-year="' + h.y.id + '" data-module="' + h.m.id + '" style="cursor:pointer;">' +
      '<div class="row between"><span class="tag">' + h.type + '</span><span class="faint">' + esc(h.y.label) + ' · ' + esc(h.m.name) + '</span></div>' +
      '<p style="-webkit-line-clamp:2; overflow:hidden; display:-webkit-box; -webkit-box-orient:vertical;">' + esc(h.label) + '</p>' +
    '</div>';
  }).join("");
}

/* --- Actualiser la liste des matières depuis une table des matières (PDF/DOCX/PPTX) --- */
function moduleNameExists(year, name){
  var norm = normalizeForMatch(name);
  return year.modules.some(function(m){ return normalizeForMatch(m.name) === norm; });
}
function detectYearHeaderIndex(line){
  var norm = normalizeForMatch(line);
  if (norm.length > 60) return -1;
  if (/\b(1ere|1re|premiere)\s*annee\b/.test(norm) || /\bannee\s*1\b/.test(norm) || /\bniveau\s*1\b/.test(norm) || /\bl1\b/.test(norm)) return 0;
  if (/\b(2eme|2e|deuxieme)\s*annee\b/.test(norm) || /\bannee\s*2\b/.test(norm) || /\bniveau\s*2\b/.test(norm) || /\bl2\b/.test(norm)) return 1;
  if (/\b(3eme|3e|troisieme)\s*annee\b/.test(norm) || /\bannee\s*3\b/.test(norm) || /\bniveau\s*3\b/.test(norm) || /\bl3\b/.test(norm)) return 2;
  return -1;
}
var RE_TOC_LEADING = /^\s*(?:[IVXLCM]{1,6}|[0-9]{1,2})\s*[\.\)\-–:]\s*/i;
var RE_TOC_TRAILING_PAGE = /[\s.\-–_]{2,}\d{1,4}\s*$/;
var RE_TOC_BULLET = /^\s*[•\-–*▪●○]\s*/;
var TOC_NOISE_WORDS = ["sommaire","table des matieres","programme","plan de formation","plan d'etudes","contenu","index","matieres","liste des matieres"];
function parseModuleNamesFromText(text){
  var lines = text.split(/\r?\n/);
  var out = [];
  var currentYear = -1;
  var seen = {};
  lines.forEach(function(raw){
    var line = raw.trim();
    if (!line) return;
    var yi = detectYearHeaderIndex(line);
    if (yi !== -1){ currentYear = yi; return; }
    var cleaned = line.replace(RE_TOC_TRAILING_PAGE, "").replace(RE_TOC_LEADING, "").replace(RE_TOC_BULLET, "").trim();
    if (cleaned.length < 3 || cleaned.length > 90) return;
    if (/^\d+$/.test(cleaned)) return;
    var norm = normalizeForMatch(cleaned);
    if (TOC_NOISE_WORDS.indexOf(norm) !== -1) return;
    var key = currentYear + "|" + norm;
    if (seen[key]) return;
    seen[key] = true;
    out.push({ name: cleaned, yearIndex: currentYear });
  });
  return out;
}

function modalTocImportReview(defaultYearId, items){
  var targetYear = items.map(function(it){
    if (it.yearIndex !== -1 && state.years[it.yearIndex]) return state.years[it.yearIndex].id;
    return defaultYearId;
  });
  var included = items.map(function(it, i){
    var y = findYear(targetYear[i]);
    return !moduleNameExists(y, it.name);
  });
  function renderOne(it, i){
    var y = findYear(targetYear[i]);
    var already = moduleNameExists(y, it.name);
    return '<div class="item">' +
      '<label class="checkbox-row small" style="margin-bottom:6px;"><input type="checkbox" data-inc="' + i + '" ' + (included[i]?'checked':'') + '> Inclure' + (already?' <span class="faint">(déjà existante dans l\'année choisie)</span>':'') + '</label>' +
      fieldText("Nom de la matière", "toc-name-" + i, it.name) +
      '<label class="field"><span>Année</span><select id="toc-year-' + i + '">' +
        state.years.map(function(y2){ return '<option value="' + y2.id + '" ' + (targetYear[i]===y2.id?'selected':'') + '>' + esc(y2.label) + '</option>'; }).join("") +
      '</select></label>' +
    '</div>';
  }
  var body = '<div class="row between small" style="margin-bottom:8px;"><span>' + items.length + ' matière(s) détectée(s) — vérifie avant d\'importer.</span>' +
    '<button type="button" class="btn sm" id="toc-toggle-all">Tout (dé)sélectionner</button></div>' +
    '<div id="toc-list" style="max-height:50vh; overflow:auto;">' + items.map(renderOne).join("") + '</div>';
  openModal("Vérifier avant import", body, {
    submitLabel: "Importer",
    onMount: function(){
      document.querySelectorAll("[data-inc]").forEach(function(cb){
        cb.onchange = function(){ included[+cb.getAttribute("data-inc")] = cb.checked; };
      });
      items.forEach(function(it, i){
        var nameInp = document.getElementById("toc-name-" + i);
        if (nameInp) nameInp.oninput = function(){ items[i].name = nameInp.value; };
        var yearSel = document.getElementById("toc-year-" + i);
        if (yearSel) yearSel.onchange = function(){ targetYear[i] = yearSel.value; };
      });
      document.getElementById("toc-toggle-all").onclick = function(){
        var allOn = included.every(function(v){ return v; });
        included = included.map(function(){ return !allOn; });
        document.querySelectorAll("[data-inc]").forEach(function(cb, idx){ cb.checked = included[idx]; });
      };
    },
    onSubmit: function(){
      var added = 0, ignored = 0;
      items.forEach(function(it, i){
        if (!included[i]) return;
        var name = (it.name||"").trim();
        if (!name) return;
        var y = findYear(targetYear[i]);
        if (!y) return;
        if (moduleNameExists(y, name)){ ignored++; return; }
        y.modules.push(makeModule(name));
        added++;
      });
      saveState(); closeModal(); render();
      showToast(added + " matière(s) ajoutée(s)" + (ignored ? (", " + ignored + " déjà existante(s) ignorée(s)") : "") + ".");
    }
  });
}

/* =========================================================
   IMPORT DEPUIS FICHIER (PDF / DOCX / TXT)
   ========================================================= */
function loadScript(src){
  return new Promise(function(resolve, reject){
    var s = document.createElement("script");
    s.src = src;
    s.onload = function(){ resolve(); };
    s.onerror = function(){ reject(new Error("Impossible de charger " + src + " (connexion internet requise la première fois).")); };
    document.head.appendChild(s);
  });
}
function ensurePdfJs(){
  if (window.pdfjsLib) return Promise.resolve();
  return loadScript("vendor-pdf.min.js").then(function(){
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = "vendor-pdf-worker.min.js";
  });
}
function ensureMammoth(){
  if (window.mammoth) return Promise.resolve();
  return loadScript("vendor-mammoth.min.js");
}
function ensureJsPdf(){
  if (window.jspdf) return Promise.resolve();
  return loadScript("vendor-jspdf.min.js");
}
/* Génère un vrai fichier PDF (ouvrable dans n'importe quel lecteur PDF)
   à partir d'un texte brut, avec retour à la ligne et pagination
   automatiques. Utilisé pour que les cours chargés en .docx/.pptx soient
   disponibles uniquement en PDF pour l'étudiant, quel que soit le format
   d'origine du fichier importé. */
function textToPdfBlob(title, text){
  return ensureJsPdf().then(function(){
    var jsPDF = window.jspdf.jsPDF;
    var doc = new jsPDF({ unit: "pt", format: "a4" });
    var margin = 48;
    var pageWidth = doc.internal.pageSize.getWidth();
    var pageHeight = doc.internal.pageSize.getHeight();
    var maxWidth = pageWidth - margin * 2;
    var y = margin;
    doc.setFont("helvetica", "bold"); doc.setFontSize(14);
    doc.splitTextToSize(title || "Cours", maxWidth).forEach(function(line){ doc.text(line, margin, y); y += 18; });
    y += 12;
    doc.setFont("helvetica", "normal"); doc.setFontSize(11);
    var lineHeight = 15;
    doc.splitTextToSize(text || "(document sans texte extrait)", maxWidth).forEach(function(line){
      if (y > pageHeight - margin){ doc.addPage(); y = margin; }
      doc.text(line, margin, y);
      y += lineHeight;
    });
    return doc.output("blob");
  });
}
function fileToDataUrl(file){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(){ resolve(reader.result); };
    reader.onerror = function(){ reject(new Error("Lecture du fichier impossible.")); };
    reader.readAsDataURL(file);
  });
}
/* Insère une photo sur une page PDF unique, centrée et mise à l'échelle. */
function imageToPdfBlob(dataUrl, imgFormat){
  return ensureJsPdf().then(function(){
    var jsPDF = window.jspdf.jsPDF;
    var doc = new jsPDF({ unit: "pt", format: "a4" });
    var pageWidth = doc.internal.pageSize.getWidth();
    var pageHeight = doc.internal.pageSize.getHeight();
    return new Promise(function(resolve){
      var img = new Image();
      img.onload = function(){
        var margin = 30;
        var ratio = Math.min((pageWidth - margin*2)/img.width, (pageHeight - margin*2)/img.height, 1);
        var w = img.width * ratio, h = img.height * ratio;
        doc.addImage(dataUrl, imgFormat, (pageWidth-w)/2, (pageHeight-h)/2, w, h);
        resolve(doc.output("blob"));
      };
      img.src = dataUrl;
    });
  });
}
function extractTextFromPDF(arrayBuffer){
  return ensurePdfJs().then(function(){
    return window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  }).then(function(doc){
    var pagePromises = [];
    for (var i=1;i<=doc.numPages;i++){
      pagePromises.push((function(pageNum){
        return doc.getPage(pageNum).then(function(page){
          return page.getTextContent().then(function(tc){
            return tc.items.map(function(it){ return it.str + (it.hasEOL ? "\n" : " "); }).join("");
          });
        });
      })(i));
    }
    return Promise.all(pagePromises).then(function(pages){ return pages.join("\n\n"); });
  });
}
function extractTextFromDocx(arrayBuffer){
  return ensureMammoth().then(function(){
    return window.mammoth.extractRawText({ arrayBuffer: arrayBuffer });
  }).then(function(res){ return res.value; });
}
var ALLOWED_DOC_EXTENSIONS = [".pdf",".docx",".pptx",".png",".jpg",".jpeg",".gif",".webp"];
function hasAllowedExtension(name){
  var n = name.toLowerCase();
  return ALLOWED_DOC_EXTENSIONS.some(function(ext){ return n.endsWith(ext); });
}
function isImageName(name){
  return /\.(png|jpe?g|gif|webp)$/.test(name.toLowerCase());
}
function extractTextFromFile(file){
  var name = file.name.toLowerCase();
  if (!hasAllowedExtension(name)){
    return Promise.reject(new Error("Type de fichier non autorisé : seuls les cours et sujets au format PDF, Word (.docx), PowerPoint (.pptx) ou image (photo) sont acceptés."));
  }
  return file.arrayBuffer().then(function(buf){
    if (name.endsWith(".pdf")) return extractTextFromPDF(buf);
    if (name.endsWith(".docx")) return extractTextFromDocx(buf);
    if (name.endsWith(".pptx")) return extractTextFromPptx(buf);
    return Promise.reject(new Error("Cette image ne peut pas être lue automatiquement (l'appli ne fait pas de reconnaissance de texte sur les photos). Regarde la photo et tape ou colle son contenu dans le champ « Texte à analyser » ci-dessous — ou envoie directement la photo à Claude en conversation pour qu'il l'intègre pour toi."));
  });
}
