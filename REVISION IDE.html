var MEDICAL_KEYWORDS = ["anatom","physiolog","patholog","infirm","patient","malad","traitement","symptom",
  "diagnostic","clinique","medic","sante","soin","hopital","chirurg","pharmaco","vaccin","fievre","douleur",
  "therap","syndrome","virus","bacter","infection","grossess","accouch","tubercul","paludism","hemat","sang",
  "coeur","cardiaqu","poumon","respirat","bronch","pneumon","dyspnee","cyanose","toux","expectoration","rein",
  "foie","cerveau","nerveux","digestif","hygien","asepsie","sterilisa","pansement","perfusion","injection",
  "posologie","prescription","epidemio","prevention","depistage","obstetriq","gyneco","pediatr","neonat",
  "nourrisson","uterus","placenta","cesarien","hemorrag","anemie","diabet","hypertension","tension arteriel",
  "pouls","temperature corporelle","fracture","plaie","antibiotiq","antalgiq","infas","hemoglobin","artere",
  "veine","lesion","tumeur","cancer","immunitair","allergi","asthm","urin","vessie","prostate","menstru",
  "ovul","spermat","contracept","sida","vih","meningite","paralysie","coma","choc hypovolemique","reanimation",
  "bloc operatoire","suture","cicatris","biopsie","radiographi","echographi","hormone","insuline","glycemie",
  "cholesterol","muscul","squelet","articul","tendon","ligament","dermat","ophtalmo","otite","gencive","qcm",
  "qcd","semiologie","deontolog"];
function normalizeForMatch(s){
  return (s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
}
function looksMedical(text){
  var norm = normalizeForMatch(text);
  return MEDICAL_KEYWORDS.some(function(kw){ return norm.indexOf(kw) !== -1; });
}

/* Le contenu doit aussi ressembler à un cours, un sujet d'examen ou une
   série de questions — pas n'importe quel texte mentionnant la santé
   (ex. article, actualité, publicité médicale…). */
var EDU_KEYWORDS = ["sujet","cours","evaluation","examen","exercice","question","qcm","qcd","chapitre",
  "reponse","corrige","enonce","epreuve","devoir","fiche de cours","objectif pedagogique","module",
  "licence","version a","version b","groupe 1","groupe 2","duree :","cochez","choisir la bonne"];
var RE_NUMBERED_LINE = /(^|\n)\s*\d{1,3}\s*[\.\)\-]\s+\S/;
var RE_LETTERED_OPTION_LINE = /(^|\n)\s*[A-Ea-e]\s*[\.\)\-]\s+\S/;
function looksLikeCourseOrExam(text){
  var norm = normalizeForMatch(text);
  if (RE_NUMBERED_LINE.test(text) || RE_LETTERED_OPTION_LINE.test(text)) return true;
  return EDU_KEYWORDS.some(function(kw){ return norm.indexOf(kw) !== -1; });
}
/* Retourne un message d'erreur si le contenu doit être refusé, ou null s'il est accepté. */
function contentRejectionReason(text){
  if (!looksMedical(text)) return "⛔ Ce contenu ne ressemble pas à un cours ou un sujet de santé/médecine. Import refusé — cette appli est réservée au contenu médical.";
  if (!looksLikeCourseOrExam(text)) return "⛔ Ce contenu semble médical mais ne ressemble pas à un cours, un sujet d'examen ou une série de questions. Import refusé — cette appli n'accepte que des cours, des sujets ou des questions, rien d'autre.";
  return null;
}

/* --- Analyse heuristique du texte importé --- */
var RE_QUESTION_START = /^\s*(?:Q(?:uestion)?\.?\s*)?(\d{1,3})\s*[\.\)\:\-]\s+(.+)$/i;
var RE_OPTION = /^\s*([A-Ea-e])\s*[\.\)\:\-]\s+(.+)$/;
var RE_ANSWER = /^\s*(?:R[ée]ponses?|Corrig[ée]s?|Solutions?|Bonnes?\s+r[ée]ponses?)\s*(?:correcte)?s?\s*[:\-]?\s*(.*)$/i;

function parseQuestionsFromText(text, kind){
  var lines = text.split(/\r?\n/).map(function(l){ return l.trim(); });
  var results = [];
  var current = null;
  function pushCurrent(){
    if (current && current.question && current.options.length >= 2) results.push(current);
    current = null;
  }
  lines.forEach(function(line){
    if (!line) return;
    var om = line.match(RE_OPTION);
    var qm = !om ? line.match(RE_QUESTION_START) : null;
    var am = !om && !qm ? line.match(RE_ANSWER) : null;
    if (qm){
      pushCurrent();
      current = { question: qm[2].trim(), options: [], letters: [], correctLetters: [] };
      return;
    }
    if (om && current){
      current.options.push(om[2].trim());
      current.letters.push(om[1].toUpperCase());
      return;
    }
    if (am && current){
      var found = (am[1].toUpperCase().match(/[A-E]/g)) || [];
      current.correctLetters = found;
      return;
    }
    if (current){
      if (current.options.length) current.options[current.options.length-1] += " " + line;
      else current.question += " " + line;
    }
  });
  pushCurrent();
  results.forEach(function(r){
    r.correct = [];
    r.correctLetters.forEach(function(L){
      var idx = r.letters.indexOf(L);
      if (idx !== -1 && r.correct.indexOf(idx) === -1) r.correct.push(idx);
    });
    if (kind === "qcd" && r.correct.length > 1) r.correct = [r.correct[0]];
    if (!r.correct.length) r.correct = [0];
    r.explanation = "";
    delete r.letters; delete r.correctLetters;
  });
  return results;
}
function parseExercicesFromText(text){
  var lines = text.split(/\r?\n/).map(function(l){ return l.trim(); });
  var results = [];
  var current = null;
  lines.forEach(function(line){
    if (!line) return;
    var qm = line.match(RE_QUESTION_START);
    var am = !qm ? line.match(RE_ANSWER) : null;
    if (qm){
      if (current && current.statement) results.push(current);
      current = { statement: qm[2].trim(), correction: "" };
      return;
    }
    if (am && current){
      current.correction = (current.correction ? current.correction + " " : "") + am[1];
      return;
    }
    if (current){
      if (current.correction) current.correction += " " + line;
      else current.statement += " " + line;
    }
  });
  if (current && current.statement) results.push(current);
  return results;
}
var RE_HEADING = /^(?:chapitre|partie|section|module)?\s*\d{1,2}\s*[\.\)\:\-]\s*(.{3,80})$/i;
function parseCoursSections(text){
  var lines = text.split(/\r?\n/);
  var sections = [];
  var current = null;
  lines.forEach(function(raw){
    var line = raw.trim();
    if (line.length && line.length < 90 && RE_HEADING.test(line) ){
      if (current) sections.push(current);
      current = { title: line, body: "" };
    } else if (current){
      current.body += (current.body ? "\n" : "") + raw;
    } else if (line){
      current = { title: "Introduction", body: raw };
    }
  });
  if (current) sections.push(current);
  sections.forEach(function(s){ s.body = s.body.trim(); });
  return sections;
}

/* --- Modales d'import --- */
function modalImportStart(yearId, moduleId, kind){
  var kindLabel = { cours:"cours", qcm:"questions QCM", qcd:"questions QCD", exercices:"exercices" }[kind];
  var body =
    '<p class="small muted">Importe un fichier <strong>.pdf</strong>, <strong>.docx</strong> (Word), <strong>.pptx</strong> (PowerPoint) ou une <strong>image</strong> (photo) contenant tes ' + kindLabel + ' — par exemple un sujet d\'évaluation INFAS — ou colle directement le texte. Seuls les cours et sujets de santé/médecine sont acceptés. Les anciens fichiers <strong>.doc</strong> ne sont pas pris en charge : réenregistre-les en .docx depuis Word, ou copie-colle leur contenu. Les <strong>photos</strong> ne peuvent pas être lues automatiquement (pas de reconnaissance de texte) : envoie-les plutôt directement à Claude dans la conversation.</p>' +
    (kind==="qcm"||kind==="qcd" ? '<p class="faint">Format reconnu : questions numérotées (« 1. », « 2) »…), options lettrées (« A. », « B) »…) et une ligne « Réponse : B » ou « Corrigé : B, C ». Vérifie toujours le résultat avant d\'importer.</p>' : "") +
    '<label class="field"><span>Fichier (optionnel)</span><input type="file" id="imp-file" accept=".pdf,.docx,.pptx,.png,.jpg,.jpeg,.gif,.webp"></label>' +
    '<div id="imp-status" class="faint" style="margin:4px 0 10px;"></div>' +
    fieldTextarea("Texte à analyser", "imp-text", "", "Colle ici le texte de ta banque de sujets si tu ne fournis pas de fichier…");
  openModal("Importer — " + kindLabel, body, {
    submitLabel: "Analyser →",
    onMount: function(){
      document.getElementById("imp-file").addEventListener("change", function(e){
        var file = e.target.files[0];
        if (!file) return;
        var statusEl = document.getElementById("imp-status");
        statusEl.textContent = "Extraction du texte en cours…";
        extractTextFromFile(file).then(function(text){
          var ta = document.getElementById("imp-text");
          if (ta) ta.value = text;
          statusEl.textContent = "Texte extrait (" + text.length + " caractères). Vérifie/corrige si besoin, puis clique sur « Analyser ».";
        }).catch(function(err){
          statusEl.textContent = "⚠️ " + err.message;
        });
      });
    },
    onSubmit: function(){
      var text = document.getElementById("imp-text").value;
      if (!text.trim()) return showToast("Choisis un fichier ou colle du texte.");
      var rejectReason = contentRejectionReason(text);
      if (rejectReason) return showToast(rejectReason);
      var items;
      if (kind === "qcm" || kind === "qcd") items = parseQuestionsFromText(text, kind);
      else if (kind === "exercices") items = parseExercicesFromText(text);
      else items = parseCoursSections(text);
      if (!items.length) return showToast("Aucun élément détecté. Vérifie la numérotation (1., 2., options A. B. C.…) et réessaie.");
      closeModal();
      modalImportReview(yearId, moduleId, kind, items);
    }
  });
}
function modalImportReview(yearId, moduleId, kind, items){
  var included = items.map(function(){ return true; });
  function renderOneItem(it, i){
    if (kind === "cours"){
      return '<div class="item">' +
        '<label class="checkbox-row small" style="margin-bottom:6px;"><input type="checkbox" data-inc="' + i + '" checked> Inclure</label>' +
        fieldText("Titre", "rev-title-" + i, it.title) +
        fieldTextarea("Contenu", "rev-body-" + i, it.body) +
      '</div>';
    }
    if (kind === "exercices"){
      return '<div class="item">' +
        '<label class="checkbox-row small" style="margin-bottom:6px;"><input type="checkbox" data-inc="' + i + '" checked> Inclure</label>' +
        fieldTextarea("Énoncé", "rev-stmt-" + i, it.statement) +
        fieldTextarea("Correction", "rev-corr-" + i, it.correction) +
      '</div>';
    }
    return '<div class="item">' +
      '<label class="checkbox-row small" style="margin-bottom:6px;"><input type="checkbox" data-inc="' + i + '" checked> Inclure</label>' +
      fieldText("Question", "rev-q-" + i, it.question) +
      '<div class="small" style="font-weight:700; margin:6px 0 4px;">Options (coche la ou les bonnes réponses)</div>' +
      it.options.map(function(opt,j){
        return '<div class="opt-row"><input type="' + (kind==="qcm"?"checkbox":"radio") + '" name="rev-correct-' + i + '" data-rev-correct="' + i + '-' + j + '" ' + (it.correct.indexOf(j)!==-1?'checked':'') + '>' +
          '<input type="text" data-rev-opt="' + i + '-' + j + '" value="' + escAttr(opt) + '"></div>';
      }).join("") +
    '</div>';
  }
  var body = '<div class="row between small" style="margin-bottom:8px;"><span>' + items.length + ' élément(s) détecté(s) — vérifie avant d\'importer.</span>' +
    '<button type="button" class="btn sm" id="rev-toggle-all">Tout (dé)sélectionner</button></div>' +
    '<div id="rev-list" style="max-height:50vh; overflow:auto;">' + items.map(renderOneItem).join("") + '</div>';

  openModal("Vérifier avant import", body, {
    submitLabel: "Importer",
    onMount: function(){
      document.querySelectorAll("[data-inc]").forEach(function(cb){
        cb.onchange = function(){ included[+cb.getAttribute("data-inc")] = cb.checked; };
      });
      if (kind === "qcm" || kind === "qcd"){
        document.querySelectorAll("[data-rev-correct]").forEach(function(cb){
          cb.onchange = function(){
            var parts = cb.getAttribute("data-rev-correct").split("-");
            var i = +parts[0], j = +parts[1];
            if (kind === "qcd"){ items[i].correct = [j]; }
            else {
              var pos = items[i].correct.indexOf(j);
              if (cb.checked && pos === -1) items[i].correct.push(j);
              if (!cb.checked && pos !== -1) items[i].correct.splice(pos,1);
            }
          };
        });
        document.querySelectorAll("[data-rev-opt]").forEach(function(inp){
          inp.oninput = function(){
            var parts = inp.getAttribute("data-rev-opt").split("-");
            items[+parts[0]].options[+parts[1]] = inp.value;
          };
        });
        items.forEach(function(it,i){
          var qInp = document.getElementById("rev-q-" + i);
          if (qInp) qInp.oninput = function(){ items[i].question = qInp.value; };
        });
      }
      if (kind === "cours"){
        items.forEach(function(it,i){
          var t = document.getElementById("rev-title-" + i), b = document.getElementById("rev-body-" + i);
          if (t) t.oninput = function(){ items[i].title = t.value; };
          if (b) b.oninput = function(){ items[i].body = b.value; };
        });
      }
      if (kind === "exercices"){
        items.forEach(function(it,i){
          var s = document.getElementById("rev-stmt-" + i), c = document.getElementById("rev-corr-" + i);
          if (s) s.oninput = function(){ items[i].statement = s.value; };
          if (c) c.oninput = function(){ items[i].correction = c.value; };
        });
      }
      document.getElementById("rev-toggle-all").onclick = function(){
        var allOn = included.every(function(v){ return v; });
        included = included.map(function(){ return !allOn; });
        document.querySelectorAll("[data-inc]").forEach(function(cb, idx){ cb.checked = included[idx]; });
      };
    },
    onSubmit: function(){
      var m = findModule(yearId, moduleId);
      var count = 0;
      items.forEach(function(it,i){
        if (!included[i]) return;
        if (kind === "cours"){
          if (!it.title || !it.title.trim()) return;
          m.cours.push({ id:uid(), title:it.title.trim(), body:(it.body||"").trim(), reviewLater:false, lastReviewed:null });
        } else if (kind === "exercices"){
          if (!it.statement || !it.statement.trim()) return;
          m.exercices.push({ id:uid(), statement:it.statement.trim(), correction:(it.correction||"").trim(), reviewLater:false, mastered:false });
        } else {
          var opts = it.options.map(function(o){ return o.trim(); }).filter(function(o){ return o; });
          if (!it.question || !it.question.trim() || opts.length < 2 || !it.correct.length) return;
          m[kind].push({ id:uid(), question:it.question.trim(), options:opts, correct:it.correct.filter(function(c){ return c < opts.length; }), explanation:"", reviewLater:false, lastResult:null });
        }
        count++;
      });
      saveState(); closeModal(); render(); showToast(count + " élément(s) importé(s).");
    }
  });
}

/* =========================================================
   BIBLIOTHEQUE DE COURS (stockage permanent sur cet appareil)
   Les documents (PDF/DOCX/PPTX/images) sont conservés dans IndexedDB,
   séparément de l'état principal (localStorage), car ils peuvent être
   volumineux. Le texte des PDF/DOCX/PPTX est extrait à l'ajout pour
   permettre la recherche « Chercher dans mes cours ».
   ========================================================= */
var FILES_DB_NAME = "revision_ide_files_v1";
var FILES_STORE = "files";
var filesDbPromise = null;
function openFilesDB(){
  if (filesDbPromise) return filesDbPromise;
  filesDbPromise = new Promise(function(resolve, reject){
    if (!window.indexedDB){ reject(new Error("IndexedDB non disponible sur ce navigateur.")); return; }
    var req = indexedDB.open(FILES_DB_NAME, 1);
    req.onupgradeneeded = function(e){
      var db = e.target.result;
      if (!db.objectStoreNames.contains(FILES_STORE)){
        var store = db.createObjectStore(FILES_STORE, { keyPath: "id" });
        store.createIndex("moduleId", "moduleId", { unique:false });
      }
    };
    req.onsuccess = function(e){ resolve(e.target.result); };
    req.onerror = function(e){ reject(e.target.error); };
  });
  return filesDbPromise;
}
function dbPut(record){
  return openFilesDB().then(function(db){
    return new Promise(function(resolve, reject){
      var tx = db.transaction(FILES_STORE, "readwrite");
      tx.objectStore(FILES_STORE).put(record);
      tx.oncomplete = function(){ resolve(); };
      tx.onerror = function(){ reject(tx.error); };
    });
  });
}
function dbDeleteFile(id){
  return openFilesDB().then(function(db){
    return new Promise(function(resolve, reject){
      var tx = db.transaction(FILES_STORE, "readwrite");
      tx.objectStore(FILES_STORE).delete(id);
      tx.oncomplete = function(){ resolve(); };
      tx.onerror = function(){ reject(tx.error); };
    });
  });
}
function dbGetByModule(moduleId){
  return openFilesDB().then(function(db){
    return new Promise(function(resolve, reject){
      var tx = db.transaction(FILES_STORE, "readonly");
      var idx = tx.objectStore(FILES_STORE).index("moduleId");
      var req = idx.getAll(moduleId);
      req.onsuccess = function(){ resolve(req.result || []); };
      req.onerror = function(){ reject(req.error); };
    });
  });
}
function dbGetAllFiles(){
  return openFilesDB().then(function(db){
    return new Promise(function(resolve, reject){
      var tx = db.transaction(FILES_STORE, "readonly");
      var req = tx.objectStore(FILES_STORE).getAll();
      req.onsuccess = function(){ resolve(req.result || []); };
      req.onerror = function(){ reject(req.error); };
    });
  });
}
function dbGetFile(id){
  return openFilesDB().then(function(db){
    return new Promise(function(resolve, reject){
      var tx = db.transaction(FILES_STORE, "readonly");
      var req = tx.objectStore(FILES_STORE).get(id);
      req.onsuccess = function(){ resolve(req.result || null); };
      req.onerror = function(){ reject(req.error); };
    });
  });
}
function updateStorageUsage(){
  var el = document.getElementById("storage-usage");
  if (!el) return;
  dbGetAllFiles().then(function(files){
    var el2 = document.getElementById("storage-usage");
    if (!el2) return;
    var totalSize = files.reduce(function(s,f){ return s + (f.size||0); }, 0);
    var txt = files.length + " document(s) enregistré(s) · " + fmtSize(totalSize);
    if (navigator.storage && navigator.storage.estimate){
      navigator.storage.estimate().then(function(est){
        var el3 = document.getElementById("storage-usage");
        if (!el3) return;
        var quotaTxt = (est.quota ? " (espace disponible sur cet appareil : environ " + fmtSize(est.quota - (est.usage||0)) + ")" : "");
        el3.textContent = txt + quotaTxt;
      });
    }
    el2.textContent = txt;
  }).catch(function(){
    if (el) el.textContent = "Impossible de calculer l'espace utilisé.";
  });
}
function loadModuleDocs(moduleId){
  if (docsCache[moduleId] !== undefined) return;
  docsCache[moduleId] = null; /* mark as "loading" to avoid duplicate loads */
  dbGetByModule(moduleId).then(function(docs){
    docs.sort(function(a,b){ return b.uploadedAt - a.uploadedAt; });
    docsCache[moduleId] = docs;
    render();
  }).catch(function(err){
    docsCache[moduleId] = [];
    showToast("Impossible de charger tes documents : " + err.message);
    render();
  });
}

function detectDocKind(name){
  var n = name.toLowerCase();
  if (n.endsWith(".pdf")) return "pdf";
  if (n.endsWith(".docx")) return "docx";
  if (n.endsWith(".pptx")) return "pptx";
  if (/\.(png|jpe?g|gif|webp)$/.test(n)) return "image";
  return "other";
}
function ensureJSZip(){
  if (window.JSZip) return Promise.resolve();
  return loadScript("vendor-jszip.min.js");
}
function decodeXmlEntities(s){
  return s.replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&apos;/g,"'");
}
function extractTextFromPptx(arrayBuffer){
  return ensureJSZip().then(function(){
    return window.JSZip.loadAsync(arrayBuffer);
  }).then(function(zip){
    var slideFiles = Object.keys(zip.files).filter(function(n){ return /^ppt\/slides\/slide\d+\.xml$/.test(n); });
    slideFiles.sort(function(a,b){
      var na = parseInt(a.match(/slide(\d+)\.xml/)[1],10);
      var nb = parseInt(b.match(/slide(\d+)\.xml/)[1],10);
      return na-nb;
    });
    return Promise.all(slideFiles.map(function(name){ return zip.files[name].async("string"); })).then(function(xmls){
      return xmls.map(function(xml, i){
        var paragraphs = xml.match(/<a:p>[\s\S]*?<\/a:p>/g) || [];
        var lines = paragraphs.map(function(p){
          var texts = [];
          var re = /<a:t[^>]*>([^<]*)<\/a:t>/g;
          var mm;
          while ((mm = re.exec(p))) texts.push(decodeXmlEntities(mm[1]));
          return texts.join("");
        }).filter(function(l){ return l.length; });
        return "Diapositive " + (i+1) + " :\n" + lines.join("\n");
      }).join("\n\n");
    });
  });
}
function extractTextForDoc(kind, arrayBuffer){
  if (kind === "pdf") return extractTextFromPDF(arrayBuffer);
  if (kind === "docx") return extractTextFromDocx(arrayBuffer);
  if (kind === "pptx") return extractTextFromPptx(arrayBuffer);
  return Promise.resolve("");
}

/* =========================================================
   Cours par défaut fournis avec l'appli (fichiers du dépôt,
   servis par GitHub Pages) : au premier lancement, on les copie
   automatiquement dans le stockage local (IndexedDB) de chaque
   étudiant pour la matière correspondante, sans écraser un
   document que l'étudiant aurait déjà chargé lui-même. Chaque
   matière n'est traitée qu'une seule fois (state.defaultDocsSeeded).
   ========================================================= */
var DEFAULT_COURSE_DOCS = {
  "Anatomie et Physiologie": [{ file: "course-docs/anatomie-et-physiologie.pdf", title: "Cours Anatomie et Physiologie.pdf" }],
  "Pathologie chirurgicale": [{ file: "course-docs/pathologie-chirurgicale.pdf", title: "Cours Pathologie chirurgicale.pdf" }],
  "VIH-SIDA": [{ file: "course-docs/vih-sida.pdf", title: "Cours VIH-SIDA.pdf" }],
  "Santé publique et Épidémiologie": [
    { file: "course-docs/sante-publique.pdf", title: "Cours Santé publique — Chaîne du froid.pdf" },
    { file: "course-docs/sante-publique-formules-epidemiologie.pdf", title: "Cours Santé publique — Formules d'Épidémiologie.pdf" },
    { file: "course-docs/sante-publique-vaccins-consommables.pdf", title: "Cours Santé publique — Gestion des vaccins et consommables.pdf" }
  ],
  "Pathologies urinaires": [{ file: "course-docs/pathologies-urinaires.pdf", title: "Cours Pathologies urinaires.pdf" }],
  /* replace:true => tout autre document déjà présent pour cette matière est supprimé */
  "Pathologie médicale": [{ file: "course-docs/pathologie-medicale.pdf", title: "Cours Pathologie médicale.pdf", replace: true }]
};
function ensureDefaultCourseDocs(){
  if (!state.defaultDocsSeeded) state.defaultDocsSeeded = {};
  state.years.forEach(function(y){
    y.modules.forEach(function(m){
      var list = DEFAULT_COURSE_DOCS[m.name];
      if (!list) return;
      list.forEach(function(cfg){
      var seedKey = m.id + "::" + cfg.file;
      if (state.defaultDocsSeeded[seedKey]) return;
      dbGetByModule(m.id).then(function(existing){
        var already = existing.some(function(d){ return d.fileName === cfg.title; });
        var toRemove = cfg.replace ? existing.filter(function(d){ return d.fileName !== cfg.title; }) : [];
        var cleanup = Promise.all(toRemove.map(function(d){ return dbDeleteFile(d.id); }));
        if (already){
          return cleanup.then(function(){
            state.defaultDocsSeeded[seedKey] = true; saveState();
            if (toRemove.length){ docsCache[m.id] = undefined; render(); }
          });
        }
        return cleanup.then(function(){
          return fetch(cfg.file).then(function(res){
            if (!res.ok) throw new Error("HTTP " + res.status);
            return res.arrayBuffer();
          }).then(function(buf){
            /* Le Blob doit être créé avant l'extraction du texte : pdf.js
               détache le ArrayBuffer source une fois le document chargé,
               ce qui viderait un Blob construit après coup. */
            var blob = new Blob([buf], { type: "application/pdf" });
            return extractTextForDoc("pdf", buf).catch(function(){ return ""; }).then(function(text){
              return dbPut({
                id: uid(), yearId: y.id, moduleId: m.id, moduleName: m.name,
                fileName: cfg.title, mimeType: "application/pdf", size: blob.size, kind: "pdf",
                text: text, uploadedAt: Date.now(), blob: blob
              });
            });
          }).then(function(){
            state.defaultDocsSeeded[seedKey] = true; saveState();
            docsCache[m.id] = undefined;
            render();
          });
        });
      }).catch(function(err){
        console.warn("Cours par défaut indisponible pour " + m.name + " (" + cfg.file + ")", err);
      });
      });
    });
  });
}

function openDocFile(id){
  dbGetFile(id).then(function(rec){
    if (!rec){ showToast("Document introuvable."); return; }
    var url = URL.createObjectURL(rec.blob);
    window.open(url, "_blank");
    setTimeout(function(){ URL.revokeObjectURL(url); }, 60000);
  });
}
function wipeAllDocs(){
  return openFilesDB().then(function(db){
    return new Promise(function(resolve, reject){
      var tx = db.transaction(FILES_STORE, "readwrite");
      tx.objectStore(FILES_STORE).clear();
      tx.oncomplete = function(){ resolve(); };
      tx.onerror = function(){ reject(tx.error); };
    });
  }).catch(function(){ /* IndexedDB unavailable: nothing to wipe */ });
}
function deleteDocFile(id, moduleId){
  dbDeleteFile(id).then(function(){
    docsCache[moduleId] = (docsCache[moduleId]||[]).filter(function(d){ return d.id !== id; });
    render();
    showToast("Document supprimé.");
  });
}

/* --- Recherche dans les cours importés --- */
var STOPWORDS_FR = ["les","des","une","un","le","la","de","du","et","ou","à","au","aux","en","dans","sur","par","pour","est","sont","qui","que","quel","quelle","quels","quelles","ce","ces","cette","son","sa","ses","tu","je","il","elle","nous","vous","ils","elles","avec","sans","plus","moins","comment","pourquoi","cochez","choisir","cocher","bonne","bonnes","réponse","réponses","parmi","suivant","suivants","suivante","suivantes","vrai","faux"];
function extractKeywords(text){
  var words = (text||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/[^a-z0-9\s]/g," ").split(/\s+/).filter(Boolean);
  var seen = {};
  var out = [];
  words.forEach(function(w){
    if (w.length < 4) return;
    if (STOPWORDS_FR.indexOf(w) !== -1 || seen[w]) return;
    seen[w] = true; out.push(w);
  });
  return out.slice(0, 8);
}
function normalizeForSearch(s){
  return (s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
}
/* Trouve, dans les documents de cours chargés pour une matière, le
   paragraphe le plus pertinent pour une question donnée (le plus de
   mots-clés en commun). Sert de courte explication « prise dans le
   cours » quand une question QCM/QCD n'a pas d'explication enregistrée.
   Entièrement local/hors-ligne : simple recherche de mots-clés, pas
   d'IA — cohérent avec le choix d'une appli gratuite et sans serveur. */
var courseExcerptCache = {}; /* moduleId::questionId -> {fileName,snippet} | false (rien trouvé) | null (en cours) */
function loadCourseExcerpt(moduleId, questionId, text){
  var key = moduleId + "::" + questionId;
  if (courseExcerptCache[key] !== undefined) return;
  courseExcerptCache[key] = null;
  dbGetByModule(moduleId).then(function(docs){
    var keywords = extractKeywords(text);
    if (!keywords.length || !docs.length){ courseExcerptCache[key] = false; render(); return; }
    var best = null, bestScore = 0;
    docs.forEach(function(d){
      if (!d.text) return;
      var paragraphs = d.text.split(/\n{1,}/).filter(function(p){ return p.trim().length > 20; });
      paragraphs.forEach(function(p){
        var normP = normalizeForSearch(p);
        var score = keywords.filter(function(kw){ return normP.indexOf(kw) !== -1; }).length;
        if (score > bestScore){
          bestScore = score;
          var snippet = p.trim().replace(/\s+/g," ");
          if (snippet.length > 320) snippet = snippet.slice(0,320) + "…";
          best = { fileName: d.fileName, snippet: snippet };
        }
      });
    });
    courseExcerptCache[key] = best || false;
    render();
  }).catch(function(){ courseExcerptCache[key] = false; render(); });
}
function searchInCourses(query){
  var keywords = extractKeywords(query);
  return dbGetAllFiles().then(function(files){
    var results = [];
    files.forEach(function(f){
      if (!f.text) return;
      var normText = normalizeForSearch(f.text);
      keywords.forEach(function(kw){
        var idx = normText.indexOf(kw);
        if (idx === -1) return;
        var start = Math.max(0, idx-90);
        var end = Math.min(f.text.length, idx+kw.length+90);
        var snippet = (start>0?"…":"") + f.text.slice(start,end).replace(/\s+/g," ").trim() + (end<f.text.length?"…":"");
        results.push({ id:f.id, fileName:f.fileName, moduleName:f.moduleName, moduleId:f.moduleId, yearId:f.yearId, keyword:kw, snippet:snippet });
      });
    });
    return { keywords: keywords, results: results.slice(0,15) };
  });
}
function modalPickDoc(docs){
  var body = docs.map(function(d){
    return '<div class="item" data-action="pick-doc" data-id="'+d.id+'" style="cursor:pointer;">' +
      '<div style="min-width:0;"><strong class="small">' + docKindIcon(d.kind) + ' ' + esc(d.fileName) + '</strong>' +
      '<div class="faint">' + fmtSize(d.size) + ' · ajouté le ' + fmtDate(d.uploadedAt) + '</div></div>' +
    '</div>';
  }).join("");
  openModal("📎 Choisis un document", body, { submitLabel:"Fermer", onSubmit: function(){ closeModal(); } });
  document.querySelector("#modal-root .foot .btn:not(.primary)").style.display = "none";
}
function openSearchCoursesModal(query){
  openModal("🔍 Recherche dans mes cours", '<div class="empty small">Recherche en cours…</div>', { submitLabel:"Fermer", onSubmit: function(){ closeModal(); } });
  document.querySelector("#modal-root .foot .btn:not(.primary)").style.display = "none";
  searchInCourses(query).then(function(res){
    var body = document.getElementById("modal-body");
    if (!body) return;
    if (!res.keywords.length){
      body.innerHTML = '<div class="empty small">Question trop courte pour être recherchée.</div>';
      return;
    }
    if (!res.results.length){
      body.innerHTML = '<p class="small muted">Aucun passage trouvé pour : <strong>' + esc(res.keywords.join(", ")) + '</strong>.</p>' +
        '<p class="faint" style="margin-top:8px;">Ajoute tes cours (PDF, Word ou PowerPoint) dans l\'onglet « 📎 Documents » d\'une matière pour pouvoir les retrouver ici.</p>';
      return;
    }
    body.innerHTML = '<p class="faint" style="margin-bottom:10px;">Mots-clés recherchés : ' + esc(res.keywords.join(", ")) + '</p>' +
      res.results.map(function(r){
        return '<div class="item" data-action="go-module-docs" data-id="'+r.id+'" style="cursor:pointer;">' +
          '<div class="row between"><span class="tag deep">' + esc(r.fileName) + '</span><span class="faint">' + esc(r.moduleName) + '</span></div>' +
          '<p>…' + esc(r.snippet) + '…</p>' +
        '</div>';
      }).join("");
  });
}

/* =========================================================
   ACTIONS (délégation d'événements)
   ========================================================= */
function handleAction(action, el, ev){
  var yearId = el.getAttribute("data-year");
  var moduleId = el.getAttribute("data-module");
  var itemId = el.getAttribute("data-item");
  var kind = el.getAttribute("data-kind");

  switch(action){
    case "go":
      navigate(el.getAttribute("data-hash"));
      break;
    case "open-search": openSearchOverlay(); break;
    case "close-search": closeSearch(); break;
    case "mascot-dismiss": hideMascotBubble(); break;
    case "mascot-replay": replayMascot(); break;
    case "register-submit": submitRegistration(); break;
    case "unlock-submit": submitUnlock(); break;
    case "edit-niveau": modalEditNiveau(); break;
    case "telegram-sync": syncTelegramImports(false); break;
    case "telegram-move": modalTelegramMove(el.getAttribute("data-id")); break;
    case "search-goto":
      closeSearch();
      navigate("#/programme/" + yearId);
      break;
    case "dismiss-onboarding":
      state.onboardingSeen = true; saveState(); render();
      break;

    case "module-primary-click":
      dbGetByModule(moduleId).then(function(docs){
        docs.sort(function(a,b){ return b.uploadedAt - a.uploadedAt; });
        docsCache[moduleId] = docs;
        if (docs.length === 1){
          openDocFile(docs[0].id);
        } else if (docs.length > 1){
          modalPickDoc(docs);
        } else {
          showToast("Aucun document de cours pour cette matière pour le moment.");
        }
      });
      break;
    case "add-module": modalAddModule(yearId); break;
    case "toc-import-start": modalTocImportStart(yearId); break;
    case "rename-module": modalRenameModule(yearId, moduleId); break;
    case "delete-module":
      if (confirm("Supprimer cette matière et tout son contenu ?")){
        var y = findYear(yearId);
        y.modules = y.modules.filter(function(m){return m.id!==moduleId;});
        saveState(); render();
      }
      break;

    case "import-start": modalImportStart(yearId, moduleId, kind); break;

    case "doc-open": openDocFile(el.getAttribute("data-id")); break;
    case "doc-delete":
      if (confirm("Supprimer définitivement ce document de cet appareil ?")){
        deleteDocFile(el.getAttribute("data-id"), el.getAttribute("data-module"));
      }
      break;
    case "search-courses": openSearchCoursesModal(el.getAttribute("data-query")); break;
    case "go-module-docs":
      closeModal();
      openDocFile(el.getAttribute("data-id"));
      break;
    case "pick-doc":
      closeModal();
      openDocFile(el.getAttribute("data-id"));
      break;

    /* Quiz setup */
    case "quiz-set-kind": quizSetup.kind = el.getAttribute("data-kind"); render(); break;
    case "quiz-set-year": quizSetup.year = el.getAttribute("data-year"); quizSetup.modules=[]; render(); break;
    case "quiz-toggle-module":
      var mid = el.getAttribute("data-module");
      var pos = quizSetup.modules.indexOf(mid);
      if (pos===-1) quizSetup.modules.push(mid); else quizSetup.modules.splice(pos,1);
      break;
    case "quiz-toggle-review": quizSetup.onlyReview = !quizSetup.onlyReview; render(); break;
    case "quiz-set-count": break; /* handled on input event */
    case "quiz-start": startQuiz(); break;
    case "diplome-start":
      var dCount = parseInt((document.getElementById("diplome-count")||{}).value, 10);
      startDiplomeExam(dCount || 30);
      break;

    /* Quiz run */
    case "quiz-select": quizSelectOption(+el.getAttribute("data-index")); break;
    case "quiz-toggle-flag": quizSession.currentFlag = !quizSession.currentFlag; render(); break;
    case "quiz-validate": quizValidate(); break;
    case "quiz-next": quizNext(); break;
    case "quiz-retry-missed": quizRetryMissed(); break;

    /* Exo setup */
    case "exo-set-year": exoSetup.year = el.getAttribute("data-year"); exoSetup.modules=[]; render(); break;
    case "exo-toggle-module":
      var emid = el.getAttribute("data-module");
      var epos = exoSetup.modules.indexOf(emid);
      if (epos===-1) exoSetup.modules.push(emid); else exoSetup.modules.splice(epos,1);
      break;
    case "exo-toggle-review": exoSetup.onlyReview = !exoSetup.onlyReview; render(); break;
    case "exo-start": startExo(); break;

    /* Exo run */
    case "exo-reveal": exoSession.revealed = true; render(); break;
    case "exo-flag":
      var ce = exoSession.items[exoSession.index];
      var origE = findExoOriginal(ce);
      if (origE) origE.reviewLater = !origE.reviewLater;
      saveState(); render();
      break;
    case "exo-mark":
      var val = el.getAttribute("data-val") === "1";
      var ce2 = exoSession.items[exoSession.index];
      var origE2 = findExoOriginal(ce2);
      if (origE2){ origE2.mastered = val; if (val) origE2.reviewLater = false; }
      saveState();
      exoSession.index++; exoSession.revealed = false;
      render();
      break;

    /* Cas cliniques setup */
    case "cas-set-year": casSetup.year = el.getAttribute("data-year"); render(); break;
    case "cas-toggle-review": casSetup.onlyReview = !casSetup.onlyReview; render(); break;
    case "cas-start": startCas(); break;

    /* Cas cliniques run */
    case "cas-select": casSelectOption(+el.getAttribute("data-index")); break;
    case "cas-toggle-flag": casSession.currentFlag = !casSession.currentFlag; render(); break;
    case "cas-validate": casValidate(); break;
    case "cas-next": casNext(); break;
    case "cas-retry-missed": casRetryMissed(); break;

    /* Reglages */
    case "export-data": exportData(); break;
    case "import-data": document.getElementById("import-file").click(); break;
    case "reset-seed":
      if (confirm("Restaurer le contenu d'exemple ? Cela remplacera TOUTES tes données actuelles.")){
        state = buildSeed(); saveState(); render(); showToast("Contenu d'exemple restauré.");
      }
      break;
    case "clear-all":
      if (confirm("Effacer toutes les données (cours, QCM, QCD, exercices, progression) ET tous tes documents ? Cette action est irréversible.")){
        state = buildSeed();
        state.years.forEach(function(y){ y.modules = []; });
        state.onboardingSeen = true;
        saveState();
        wipeAllDocs().then(function(){ docsCache = {}; render(); showToast("Toutes les données ont été effacées."); });
      }
      break;
    case "clear-docs":
      if (confirm("Supprimer définitivement tous les documents ajoutés sur cet appareil ? Cette action est irréversible.")){
        wipeAllDocs().then(function(){ docsCache = {}; render(); showToast("Tous les documents ont été supprimés."); });
      }
      break;

    case "modal-cancel": closeModal(); break;
    case "modal-submit": if (currentModalSubmit) currentModalSubmit(); break;
    case "modal-overlay": closeModal(); break;
    case "noop": break;
  }
}

function findExoOriginal(sessionItem){
  var m = findModule(sessionItem.yearId, sessionItem.moduleId);
  return m ? m.exercices.find(function(e){ return e.id === sessionItem.id; }) : null;
}

/* ---- Quiz logic ---- */
function startQuiz(){
  var pool = collectQuestions(quizSetup.kind, quizSetup.year, quizSetup.modules.length?quizSetup.modules:null, quizSetup.onlyReview);
  if (!pool.length) return;
  var n = Math.min(quizSetup.count, pool.length);
  var items = shuffle(pool).slice(0, n);
  quizSession = { items: items, index: 0, answers: [], currentSelection: [], showFeedback:false, currentFlag:false, examType:"normal", logged:false };
  navigate("#/quiz-run");
}
function startDiplomeExam(n){
  var pool = collectQuestions("mix", "all", null, false);
  if (!pool.length) return showToast("Aucune question disponible pour l'examen blanc.");
  var count = Math.min(n || 30, pool.length);
  var items = shuffle(pool).slice(0, count);
  quizSession = { items: items, index: 0, answers: [], currentSelection: [], showFeedback:false, currentFlag:false, examType:"diplome", logged:false };
  navigate("#/quiz-run");
}
function logQuizHistory(){
  var correct = quizSession.answers.filter(function(a){ return a.correct; }).length;
  var total = quizSession.items.length;
  if (!total) return;
  state.history = state.history || [];
  state.history.unshift({ id: uid(), date: Date.now(), examType: quizSession.examType || "normal", total: total, correct: correct, pct: pct(correct,total) });
  if (state.history.length > 200) state.history.length = 200;
  saveState();
}
function quizSelectOption(i){
  if (quizSession.showFeedback) return;
  var q = quizSession.items[quizSession.index];
  var sel = quizSession.currentSelection;
  if (q.__kind === "qcd"){ quizSession.currentSelection = [i]; }
  else {
    var pos = sel.indexOf(i);
    if (pos===-1) sel.push(i); else sel.splice(pos,1);
  }
  render();
}
function quizValidate(){
  var q = quizSession.items[quizSession.index];
  var sel = quizSession.currentSelection.slice().sort();
  var correct = q.correct.slice().sort();
  var isCorrect = sel.length === correct.length && sel.every(function(v,i){ return v===correct[i]; });
  quizSession.showFeedback = true;
  quizSession.answers.push({ question:q.question, moduleName:q.moduleName, correct:isCorrect });

  var m = findModule(q.yearId, q.moduleId);
  var list = q.__kind==="qcm" ? m.qcm : m.qcd;
  var orig = list.find(function(x){ return x.id===q.id; });
  if (orig){
    orig.lastResult = isCorrect;
    if (quizSession.currentFlag) orig.reviewLater = true;
    else if (isCorrect) orig.reviewLater = false;
    if (!isCorrect) orig.reviewLater = true;
  }
  saveState();
  render();
  showMascot(isCorrect ? "happy" : "encourage");
}
function quizNext(){
  quizSession.index++;
  if (quizSession.index >= quizSession.items.length && !quizSession.logged){
    logQuizHistory();
    quizSession.logged = true;
  }
  quizSession.currentSelection = [];
  quizSession.showFeedback = false;
  quizSession.currentFlag = false;
  render();
}
function quizRetryMissed(){
  var missedQuestions = quizSession.items.filter(function(item,i){ return quizSession.answers[i] && !quizSession.answers[i].correct; });
  quizSession = { items: missedQuestions, index:0, answers:[], currentSelection:[], showFeedback:false, currentFlag:false, examType: quizSession.examType, logged:false };
  render();
}

/* ---- Exercices logic ---- */
function startExo(){
  var pool = [];
  allModulesFlat().forEach(function(x){
    if (exoSetup.year!=="all" && x.year.id!==exoSetup.year) return;
    if (exoSetup.modules.length && exoSetup.modules.indexOf(x.module.id)===-1) return;
    x.module.exercices.forEach(function(e){
      if (exoSetup.onlyReview && !e.reviewLater) return;
      pool.push(Object.assign({}, e, { yearId:x.year.id, moduleId:x.module.id, moduleName:x.module.name }));
    });
  });
  if (!pool.length) return;
  exoSession = { items: shuffle(pool), index:0, revealed:false };
  navigate("#/exercices-run");
}

/* ---- Export / Import ---- */
function exportData(){
  var blob = new Blob([JSON.stringify(state, null, 2)], { type:"application/json" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  var d = new Date();
  a.href = url;
  a.download = "revision-ide-sauvegarde-" + d.toISOString().slice(0,10) + ".json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  showToast("Export téléchargé.");
}
function importDataFile(file){
  var reader = new FileReader();
  reader.onload = function(){
    try {
      var data = JSON.parse(reader.result);
      if (!data || !Array.isArray(data.years)) throw new Error("format invalide");
      if (!confirm("Importer ce fichier ? Cela remplacera toutes tes données actuelles.")) return;
      state = data;
      state.onboardingSeen = true;
      saveState(); render(); showToast("Import réussi.");
    } catch(e){ showToast("Fichier invalide."); }
  };
  reader.readAsText(file);
}

/* =========================================================
   INITIALISATION & ECOUTEURS GLOBAUX
   ========================================================= */
document.addEventListener("click", function(e){
  var el = e.target.closest("[data-action]");
  if (!el) return;
  var action = el.getAttribute("data-action");
  /* the overlay backdrop only closes the modal on a direct click, never on a
     click that bubbled up from inside the modal itself (e.g. text/inputs
     with no data-action of their own) */
  if (action === "modal-overlay" && e.target !== el) return;
  handleAction(action, el, e);
});
document.addEventListener("keydown", function(e){
  if (e.key !== "Enter") return;
  if (!e.target || !e.target.id) return;
  if (e.target.id === "unlock-matricule") submitUnlock();
  else if (e.target.id === "reg-matricule") submitRegistration();
});
document.addEventListener("change", function(e){
  if (e.target.id === "import-file" && e.target.files[0]) importDataFile(e.target.files[0]);
  if (e.target.id === "settings-name") { state.settings.name = e.target.value; saveState(); }
});
document.addEventListener("input", function(e){
  if (e.target.getAttribute && e.target.getAttribute("data-action") === "quiz-set-count"){
    var v = parseInt(e.target.value,10);
    if (v > 0) quizSetup.count = v;
  }
});

loadState();
route = parseHash();
render();

})();
</script>
