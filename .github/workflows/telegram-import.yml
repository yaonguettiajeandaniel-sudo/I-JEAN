name: Import Telegram documents

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Récupérer les nouveaux documents Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/telegram-import.mjs

      - name: Publier les nouveaux documents
        run: |
          git config user.name "telegram-import-bot"
          git config user.email "actions@users.noreply.github.com"
          git add telegram-imports
          if git diff --cached --quiet; then
            echo "Aucun nouveau document."
          else
            git commit -m "Import automatique de documents depuis Telegram"
            git push
          fi
